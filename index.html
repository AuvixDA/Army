ю организации службы.\n\n13.15. Начальники управлений самостоятельно организуют деятельность подведомственных подразделений в пределах предоставленных полномочий и несут ответственность за исполнение приказов вышестоящего командования."},{"t":"РАЗДЕЛ 14. ЗАКЛЮЧИТЕЛЬНЫЕ ПОЛОЖЕНИЯ","b":"14.1. Изменения в УВС, ДУ и УКПС разрабатываются Начальником Генерального штаба ВС РО, представляются в Министерство юстиции РО для проверки соответствия законодательству и после проверки направляются на подписание Генеральному прокурору РО в порядке статьи 28.1 Трудового кодекса РО. Юридическая сила изменений возникает после их подписания Генеральным прокурором РО; применению они подлежат после официального опубликования.\n\n14.2. Неопубликованные положения уставов не применяются."}]},{"id":"ukps","title":"Устав караульно-постовой службы (УКПС)","short":"УКПС","items":[{"t":"Вводная часть","b":"Настоящий Устав определяет порядок несения караульно-постовой службы, пропускной режим воинской части, правила радиосвязи и действия военнослужащих при проникновении и нападении.\n\nНастоящий Устав наделяется юридической силой после его подписания Генеральным прокурором РО в порядке статьи 28.1 Трудового кодекса РО. Применение положений Устава допускается после его официального опубликования. До подписания и опубликования новой редакции военнослужащие руководствуются последней действующей редакцией."},{"t":"ГЛАВА 1. ОБЩИЕ ПОЛОЖЕНИЯ","b":"1.1. Статус территории:\n- вся территория воинской части за КПП является режимным объектом;\n\n1.2. Караульно-постовую службу несёт Отдел вневедомственной охраны (ОВО). Военнослужащие других подразделений привлекаются к несению службы по приказу руководства ВС РО, начальника Управления специальных операций и разведки либо дежурного по воинской части при чрезвычайном происшествии - с уведомлением командира их подразделения.\n\n1.3. Курсанты Академии и граждане, проходящие КМБ, заступают на пост только вместе с военнослужащим от звания «Сержант» и не вправе самостоятельно задерживать лиц.\n\n1.4. Дежурный по воинской части (ДЧ) назначается из офицерского состава ОВО на смену. ДЧ координирует посты и патрули, управляет воздушным пространством, объявляет коды тревоги и экстренное построение, принимает доклады постов.\n\n1.5. Дежурный по КПП - старший по званию военнослужащий ОВО на посту; при равенстве званий - назначенный ДЧ. Все военнослужащие на посту, в том числе из других подразделений, подчиняются дежурному по КПП в вопросах несения службы."},{"t":"ГЛАВА 2. РАДИОСВЯЗЬ","b":"2.1. Коды:\nКод «Белый» [Б] - заступил на пост;\nКод «Серый» [С] - покинул пост;\nКод «Зелёный» [З] - обстановка спокойная, без происшествий;\nКод «Жёлтый» [Ж] - скопление подозрительных лиц, нарушение общественного порядка у поста;\nКод «Красный» [К] - проникновение на территорию, попытка прорыва, одиночное вооружённое нападение;\nКод «Чёрный» [Ч] - боевая тревога, нападение на воинскую часть группой вооружённых лиц.\n\n2.2. Тэги подразделений:\n[ВП] - Военная полиция;\n[ОВО] - Отдел вневедомственной охраны;\n[ССО] - Силы специальных операций;\n[ГРУ] - Главное разведывательное управление;\n[РОС] - Рота охраны и сопровождения;\n[РГ] - Росгвардия;\n[МСБ] - Мотострелковый батальон;\n[МР] - Медицинская рота;\n[АР] - Автомобильная рота;\n[УТЦ] - Учебно-тренировочный центр;\n[А] - Академия;\n[ДЧ] - Дежурный по воинской части.\nПримечание: генералитет тэга не имеет.\n\n2.3. В рацию передаётся только служебная информация - кратко и по делу. Запрещены посторонние разговоры, нецензурная брань, передача государственной тайны и служебной информации ВС РО по открытым каналам.\n\n2.4. Форма доклада: (Пост) | (Код) | Состав: (число).\nПример: «КПП-1 | Белый | Состав: 2»."},{"t":"ГЛАВА 3. ПОСТЫ","b":"3.1. Контрольно-пропускные пункты:\n\nКПП-1 - основной контрольно-пропускной пункт.\nLphBBca.jpeg\nКоличество постовых: от 1 до 8.\n\nКПП-2 - дополнительный контрольно-пропускной пункт.\nCGTNCCh.jpeg\nКоличество постовых: от 1 до 8.\n\nКПП-3 - дополнительный контрольно-пропускной пункт.\n4VZVsXz.jpeg\nКоличество постовых: от 1 до 8.\n\nКПП-4 - дополнительный контрольно-пропускной пункт.\ngWejJb5.jpeg\nКоличество постовых: от 1 до 8.\n\n3.2. Постовые вышки (ПВ):\n08NHSxE.png\nEC9BR1f.jpeg\nd11cqWz.jpeg\nПВ-1 - Красная вышка;\nПВ-2 - Жёлтая вышка;\nПВ-3 - Зелёная вышка;\nПВ-4 - Фиолетовая вышка;\nПВ-5 - Голубая вышка;\nПВ-6 - Розовая вышка;\nПВ-7 - Мятная вышка;\nПВ-8 - Синяя вышка.\n\n3.3. Приоритет заполнения постов: КПП-1 → КПП-2 → вышки → КПП-3 и КПП-4.\n\n3.4. На время вечерней поверки посты несут службу в порядке пункта 7.4 УВС."},{"t":"ГЛАВА 4. ПРОПУСКНОЙ РЕЖИМ","b":"4.1. Беспрепятственный проход на территорию воинской части имеют:\n1) военнослужащие ВС РО;\n2) Премьер-министр РО;\n3) Вице-премьер-министр РО;\n4) Генеральный прокурор РО и его заместители;\n5) Министр обороны РО и его заместители.\nЛица, указанные в подпунктах 2-5, досмотру не подлежат. Постовой только устанавливает их личность по удостоверению.\n\n4.2. В ограниченном порядке на территорию допускаются:\n1) Государственные советники при Генеральном прокуроре - с разрешения Генерального прокурора или его заместителей, для розыскной и расследовательской деятельности и прокурорских проверок;\n2) адвокаты - по вызову или по приглашению лиц, проводящих задержание, к месту проведения задержания и до его окончания;\n3) руководство задержанного государственного служащего - с разрешения лиц, проводящих процессуальные действия;\n4) сотрудники ФСО - при наличии ордера, постановления или судебного решения;\n5) сотрудники Управления «М» ФСБ - при наличии оснований полагать, что на территории находится объект оперативно-розыскных мероприятий;\n6) Министр здравоохранения, его заместители и с их позволения сотрудники Больницы - для еженедельных санитарных проверок, по предварительному согласованию с командованием и только в сопровождении военнослужащего ВС РО;\n7) Министр финансов и его заместители - с позволения Премьер-министра или Вице-премьер-министра РО, для финансовых проверок и решения организационных вопросов;\n8) лица, приглашённые лицами из подпунктов 2-5 пункта 4.1 либо комсоставом и генералитетом ВС РО, - только при непрерывном сопровождении пригласившего до выхода с территории;\n9) в период военного положения члены Правительства РО и сопровождающие их сотрудники ФСО и иных силовых ведомств - по согласованию с командованием ВС РО в установленном порядке.\nПримечание: сотрудники ФСО и Управления «М» ФСБ при возникновении сомнений обязаны разъяснить причину нахождения на территории. Сведения об объекте задержания или ОРМ они сообщают только руководству ВС РО.\n\n4.3. Иные лица на территорию воинской части не допускаются.\n\n4.3.1. Лица, обладающие статусом неприкосновенности (Премьер-министр, Вице-премьер-министр и советники Премьер-министра, министры и их заместители, судьи, сотрудники Генеральной прокуратуры при исполнении, Государственный советник при Генеральной прокуратуре, Начальник ФСО и его заместитель при исполнении, Глава Коллегии адвокатов при исполнении), а также их транспорт досмотру не подлежат. Если у такого лица нет права прохода по пунктам 4.1-4.2, постовой не открывает шлагбаум и отказывает в проезде без досмотра, задержания и применения силы, после чего докладывает ДЧ.\n4.3.2. В период военного положения члены Правительства РО и сопровождающие их сотрудники ФСО и силовых ведомств допускаются на территорию воинской части в порядке, предусмотренном подпунктом 9 пункта 4.2 настоящего Устава.\n\n4.4. Порядок проверки на КПП лица, не являющегося военнослужащим:\n1) остановить транспорт или лицо до шлагбаума;\n2) представиться: «Здравия желаю, (звание) (фамилия), ВС РО»;\n3) проверить документы или служебное удостоверение;\n4) выяснить цель визита;\n5) доложить в рацию о прибывшем, его должности и цели визита;\n6) лиц из пункта 4.2, не обладающих статусом неприкосновенности, допускается подвергнуть личному досмотру на запрещённые вещества, нелегальное оружие, взрывчатые и колюще-режущие предметы;\n7) пропустить либо отказать в проходе.\nПри обнаружении запрещённых предметов лицу отказывается в проходе. При признаках преступления постовой задерживает лицо и передаёт его Военной полиции.\n\n4.5. О прибытии лиц из подпунктов 2-5 пункта 4.1 и из пункта 4.2 постовой незамедлительно сообщает дежурному по воинской части, который уведомляет руководство ВС РО.\n\n4.6. Порядок проверки военнослужащих при въезде на территорию и выезде с территории воинской части\nПроверка военнослужащего - это процедура установления его личности, воинского звания и права на въезд или выезд с территории воинской части путём предъявления служебного удостоверения и, при необходимости, подтверждения основания для убытия.\n\nОсобенности проверки отдельных категорий\n\nГенералитет полностью освобождается от стандартной проверки на КПП. Постовой не вправе требовать у генералитета предъявления удостоверения или подтверждения основания для въезда и выезда, за исключением случаев, предусмотренных специальным распоряжением вышестоящего командования.\nКомсостав при въезде и выезде обязан предъявлять служебное удостоверение или военный билет по требованию постового. Проверка ограничивается установлением личности, звания и принадлежности к командному составу. Дополнительное подтверждение основания для выезда требуется только в случаях, предусмотренных внутренним регламентом или распоряжением вышестоящего начальника.\nОстальные военнослужащие: постовой проверяет служебное удостоверение или военный билет и основание для выезда в служебное время (разрешение на убытие, служебное задание, приказ либо окончание служебного дня).\nОсобые условия\nЛичный досмотр военнослужащих при въезде и выезде не проводится, за исключением случаев, предусмотренных установленным порядком.\n\nВоинские колонны, подразделения, задействованные в специальных операциях, а также военнослужащие, следующие в условиях тревоги или выезды по коду, пропускаются незамедлительно без стандартной процедуры проверки.\n\n4.7. Курсанты Академии и граждане, проходящие КМБ, выпускаются с территории в рабочее время только с подтверждённого разрешения инструктора УТЦ или по приказу.\n\n4.8. Если в транспорте находятся военнослужащие и лица без права доступа, постовой требует от лиц без права доступа покинуть транспорт и пропускает только имеющих право прохода.\n\n4.9. Если постовой подозревает, что военнослужащий покинул часть без права выезда, он фиксирует это и передаёт материалы Военной полиции."},{"t":"ГЛАВА 5. ОБЯЗАННОСТИ ПОСТОВОГО","b":"5.1. При заступлении на пост и уходе с него - докладывать в рацию.\nПример: «КПП-1 | Белый | Состав: 2».\n\n5.2. Каждые 15 минут докладывать о состоянии поста.\nПример: «ПВ-7 | Зелёный | Состав: 1».\n\n5.3. Заступать на пост в полном снаряжении: форма подразделения, бронежилет, заряженное табельное оружие с боекомплектом, медикаменты, рация, видеофиксация.\n\n5.4. Бдительно охранять и стойко оборонять вверенный пост.\n\n5.5. Вежливо и тактично общаться с гражданами, прибывшими на КПП, обращаясь «Гражданин» / «Гражданка».\n\n5.6. Знать опознавательные знаки и сигналы техники ВС РО, знать в лицо генералитет.\n\n5.7. Не допускать проникновения посторонних на территорию воинской части.\n\n5.8. Вести видеофиксацию происшествий, проверок и задержаний, хранить её не менее 72 часов.\n\n5.9. Знать УКПС, УВС и ДУ."},{"t":"ГЛАВА 6. ДЕЙСТВИЯ ПРИ ОБНАРУЖЕНИИ ПОСТОРОННИХ","b":"6.1. На прилегающей охраняемой территории:\n- постовой вправе потребовать документы и выяснить цель нахождения;\n- требовать покинуть прилегающую территорию только из-за отсутствия цели визита постовой не вправе;\n- при нарушении общественного порядка постовой докладывает ДЧ, который при необходимости вызывает МВД;\n- открытое ношение холодного оружия на прилегающей территории является административным правонарушением, за исключением сотрудников правоохранительных органов, находящихся при исполнении служебных обязанностей - постовой требует спрятать оружие и докладывает ДЧ;\n- при признаках преступления (угроза, нападение, оружие в руках) постовой действует по стадиям применения силы и задерживает лицо.\n\n6.2. Попытка пройти или проехать через КПП без права доступа:\n1) потребовать остановиться и покинуть КПП;\n2) чётко предупредить о применении оружия;\n3) при неподчинении и попытке прорыва - перекрыть проезд и задержать лицо;\n4) при прорыве на транспорте - открыть огонь по колёсам и двигателю, при угрозе жизни людей - на поражение.\n\n6.3.Лицо, не являющееся государственным служащим при исполнении служебных обязанностей, находящееся на территории воинской части без права доступа и заведомо не подтвердившее законные основания для пребывания, задерживается для установления законности нахождения без личного обыска. При отсутствии законных оснований и доказательств законной цели пребывания лицо задерживается по подозрению в совершении преступления, предусмотренного статьёй 213.1 Уголовного кодекса РО. Если нарушитель после предупреждения не выполняет требование остановиться, оказывает сопротивление или пытается скрыться, допускается применение огнестрельного оружия в порядке пункта 4.4 УВС. Лица, обладающие статусом неприкосновенности, и сотрудники Генеральной прокуратуры РО при исполнении служебных обязанностей по основаниям настоящего пункта не задерживаются и досмотру не подвергаются; постовой требует от них покинуть территорию без применения силы и докладывает ДЧ.\n\n6.4. Порядок фактического задержания военнослужащим, не входящим в Военную полицию (от звания «Сержант»):\n1) надеть наручники;\n2) представиться;\n3) сообщить причину задержания;\n4) если у задержанного оружие в руках - отобрать его для обеспечения безопасности (досмотр не проводится);\n5) доложить в рацию и немедленно вызвать Военную полицию;\n6) удерживать задержанного до прибытия ВП и передать его ВП с соблюдением срока, установленного подпунктом 9 пункта 10.1.5 УВС, который исчисляется с момента фактического задержания.\n7) Разъяснение прав, первичный досмотр, проверку документов, снятие предметов, скрывающих лицо, и внесение сведений в информационную систему проводит только Военная полиция в порядке пункта 10.1.5 УВС.\n\n6.5. Если лицо находится в транспорте - потребовать выйти. При отказе - извлечь из транспорта. При сопротивлении допускается физическая сила и специальные средства (резиновые пули) соразмерно сопротивлению.\n\n6.6. Задержанному при необходимости оказывается первая помощь, вызывается Медицинская рота. Лицо без сознания переворачивается на живот.\n\n6.7. Государственный служащий при исполнении на территории воинской части:\n- если его статус подтверждён служебным удостоверением, форменной одеждой, знаками различия или бодикамерой, постовой не задерживает его, а останавливает для проверки законности нахождения и докладывает ДЧ;\n- при отсутствии законных оснований и доказательств законной цели пребывания он задерживается по подозрению в совершении преступления, предусмотренного статьёй 213.1 Уголовного кодекса РО, без личного обыска; лица, обладающие статусом неприкосновенности, и сотрудники Генеральной прокуратуры РО при исполнении служебных обязанностей не задерживаются; к ним применяется последнее предложение пункта 6.3 УКПС."},{"t":"ГЛАВА 7. ПРОНИКНОВЕНИЕ И НАПАДЕНИЕ","b":"7.1. Немедленно сообщить в рацию: проникновение или одиночное нападение - код «Красный»; нападение группой вооружённых лиц - код «Чёрный».\n\n7.2. Занять безопасную позицию и подготовиться к отражению нападения со стороны своего поста.\n\n7.3. При нападении на воинскую часть, а также при попытке хищения оружия, техники и имущества ВС РО огнестрельное оружие применяется в порядке пункта 4.4 УВС - с момента нападения и до устранения угрозы. Предупреждение не требуется, если промедление создаёт непосредственную опасность для жизни людей.\n\n7.4. Постовому запрещено покидать свой пост для преследования нарушителей на других постах. Преследование ведут патруль, Военная полиция и резерв МСБ по команде ДЧ.\n\n7.5. Запрещено наводить панику и самостоятельно вступать в переговоры с нападающими. Переговоры ведут ДЧ или руководство ВС РО.\n\n7.6. Вызов МВД, ФСБ и ГИБДД производится только ДЧ, комсоставом или генералитетом.\n\n7.7. После нейтрализации нарушителей военнослужащий от звания «Сержант» надевает наручники, оказывает первую помощь, вызывает Медицинскую роту и Военную полицию и передаёт задержанных ВП. При отсутствии ВП - действует в порядке пункта 6.4.\n\n7.8. Самостоятельно вывозить задержанных в МВД, ФСБ или ГИБДД без указания ВП, ДЧ, комсостава или генералитета запрещено.\n\n7.9. При коде «Чёрный» Мотострелковый батальон поступает в распоряжение ДЧ как резерв усиления.\n\n7.10. После устранения угрозы ДЧ объявляет код «Зелёный».\n\n7.11. В период чрезвычайного и военного положения посты несут службу в усиленном составе в порядке Раздела 12 УВС, координацию действий осуществляет ФСБ."},{"t":"ГЛАВА 8. ПАТРУЛИРОВАНИЕ","b":"8.1. Патруль - вооружённый отряд, назначенный для осмотра территории и поддержания порядка. Патрулирование производится на служебной наземной или воздушной технике ВС РО либо пешим порядком.\n\n8.2. Патрулировать вправе военнослужащие от звания «Сержант» в составе не менее 2 человек.\nИсключения: Военная полиция при розыске дезертиров - от 1 человека; пеший патруль курсантов в сопровождении инструктора УТЦ.\n\n8.3. Выход в патруль разрешён только при наличии не менее одного постового на КПП-1 и КПП-2.\n\n8.4. Патруль обязан знать законодательство РО. Выход на патруль сообщается в рацию ДЧ.\n\n8.5. За пределами воинской части патрулирование осуществляют Военная полиция - для розыска дезертиров, пресечения нарушений военнослужащих и задержания правонарушителей с последующей передачей уполномоченным органам; Росгвардия - для охраны общественного порядка и обеспечения общественной безопасности в пределах пункта 10.12 УВС. ССО, ГРУ за пределами воинской части действуют в рамках поставленных служебных задач и законного содействия правоохранительным органам РО, а в период военного положения - в порядке раздела 12 УВС. Выезды РОС для охранного сопровождения не являются самостоятельным патрулированием.\n8.5.1. Сотрудники Военной полиции могут привлекать к патрулированию военнослужащих других подразделений с соблюдением требований пунктов 8.1 и 8.2 настоящего Устава и при согласовании с командованием соответствующего подразделения."},{"t":"ГЛАВА 9. ПОСТОВОМУ ЗАПРЕЩЕНО","b":"Дисциплинарные взыскания за нарушения, перечисленные в настоящей главе, применяются исключительно в порядке и размерах, установленных Дисциплинарным уставом ВС РО. Дублирование и самостоятельное установление взысканий настоящим Уставом не допускается.\n\n9.1. Умышленно отдавать и продавать вооружение и амуницию.\n\n9.2. Выпускать из рук и оставлять без присмотра вооружение и амуницию.\nПримечание: пренебрежительное отношение к оружию, повлёкшее существенные последствия, содержит признаки халатности - материалы передаются в Прокуратуру РО.\n\n9.3. Покидать пост без разрешения дежурного по КПП или ДЧ.\n\n9.4. Пропускать на территорию лиц без права доступа.\n\n9.5. Спать на посту, бездействовать и не реагировать на обстановку.\nИсключение: при необходимости отойти военнослужащий предупреждает напарника и дежурного по КПП и уходит в будку (на вышке - отходит от края площадки) не более чем на 5 минут. Если на посту он один - отходить запрещено.\n\n9.6. Отключать рацию на посту.\n\n9.7. Не докладывать о состоянии поста каждые 15 минут.\n\n9.8. Вступать в посторонние разговоры с гражданскими лицами на КПП.\nИсключения: проверка документов, выяснение цели визита, требования и предупреждения.\n\n9.9. Заступать на пост без полного снаряжения или без знания УКПС.\n\n9.10. Залезать на будки и автомобили, бегать и прыгать без причины, шуметь, слушать музыку, курить на посту.\n\n9.11. Выпускать курсантов Академии и граждан, проходящих КМБ, без разрешения.\n\n9.12. Досматривать лиц из подпунктов 2-5 пункта 4.1 и лиц, обладающих статусом неприкосновенности; задерживать государственного служащего, подтвердившего свой статус, не проверив законность его нахождения.\n\n9.13. Самостоятельно вызывать МВД, ФСБ, ГИБДД, вывозить задержанных без разрешения.\n\n9.14. Использовать полномочия постового в корыстных целях, требовать вознаграждение за пропуск.\nПримечание: материалы передаются в Прокуратуру РО.\n\n9.15. Нарушать иные положения настоящего Устава.\n\nПримечание к главе: внесение в ЧС производится в порядке пункта 2.3 ДУ."}]},{"id":"du","title":"Дисциплинарный устав (ДУ)","short":"ДУ","items":[{"t":"Вводная часть","b":"Настоящий Устав определяет виды дисциплинарных взысканий, порядок их применения, отработки, снятия и обжалования, а также перечень дисциплинарных проступков военнослужащих ВС РО.\n\nНастоящий Устав наделяется юридической силой после его подписания Генеральным прокурором РО в порядке статьи 28.1 Трудового кодекса РО. Применение положений Устава допускается после их официального опубликования. До подписания и опубликования новой редакции действует ранее утверждённая редакция.\nТермины, используемые в настоящем Уставе, применяются в значении пункта 1.9 УВС."},{"t":"РАЗДЕЛ 1. ОБЩИЕ ПОЛОЖЕНИЯ","b":"1.1. Дисциплинарный проступок - неисполнение или ненадлежащее исполнение военнослужащим своих обязанностей, нарушение уставов ВС РО или законного приказа.\n\n1.2. Виды дисциплинарных взысканий:\n- Предупреждение;\n- Выговор;\n- Понижение в должности;\n- Обязательная переаттестация;\n- Увольнение.\nДополнительно к увольнению может применяться внесение в чёрный список ВС РО (далее - ЧС). Для всех взысканий, предусматривающих понижение на 1-2 или 1-3 ступени, основным взысканием является понижение в должности. Снижение воинского звания допускается только в случаях, прямо предусмотренных законом РО, с указанием соответствующего законного основания в решении о взыскании. При отсутствии такого основания воинское звание сохраняется.\n\n1.3. Применение иных наказаний запрещено. Военнослужащие ВС РО не вправе назначать штрафы, удерживать военнослужащего, ограничивать его свободу и применять к нему физическое воздействие в качестве наказания.\n\n1.4. За один проступок применяется только одно дисциплинарное взыскание.\n\n1.5. Наказание в статьях Разделов 6 и 7 указано диапазоном. Взыскание выбирается соразмерно проступку: за первичное нарушение - по нижней границе, за грубое, неоднократное или злостное - выше.\nГрубое нарушение - повлёкшее тяжкие последствия, угрозу жизни, безопасности или существенный вред имуществу.\nНеоднократное нарушение - повторное совершение того же нарушения в течение 72 часов после взыскания.\nЗлостное нарушение - продолжение нарушения после законного требования его прекратить.\n\n1.6. Применение дисциплинарного взыскания не исключает уголовной и административной ответственности. При наличии признаков преступления или административного правонарушения материалы в обязательном порядке передаются в компетентный орган по подследственности (МВД, ФСБ, Следственный комитет или Прокуратуру РО).\n\n1.7. Дисциплинарные взыскания вправе применять также сотрудники Прокуратуры РО. Взыскания, наложенные Прокуратурой РО, исполняются командованием ВС РО, не могут быть отменены внутри ВС РО и не снимаются досрочно. Такие взыскания погашаются по истечении срока от 1 до 7 дней, установленного Прокуратурой РО, в соответствии с примечанием к статье 30.1 Трудового кодекса РО."},{"t":"РАЗДЕЛ 2. ПОРЯДОК ПРИМЕНЕНИЯ ВЗЫСКАНИЙ","b":"2.1. Право применять взыскания имеют:\n- НГШ и ЗНГШ - ко всем военнослужащим;\n- начальники управлений и их заместители - к личному составу подразделений своего управления;\n- Военная полиция - ко всем военнослужащим, кроме генералитета;\n- командир подразделения и его заместитель - к личному составу своего подразделения;\n- Начальник УТЦ - к курсантам и гражданам, проходящим КМБ;\n- Начальство ГРУ и ССО - ко всем военнослужащим во время построения на специальные операции;\n- инструкторы УТЦ - предупреждение и выговор к курсантам и гражданам, проходящим КМБ.\n\n2.2. Увольнение применяют: руководство ВС РО, начальники управлений (в отношении подчинённых военнослужащих), руководство Военной полиции, командир подразделения (к своему личному составу), Начальник УТЦ (к курсантам). При этом увольнение допускается только по основаниям, предусмотренным статьёй 43 Трудового кодекса РО и иными применимыми нормами законодательства РО.\n\n2.3. Внесение в ЧС:\n2.3.1. В ЧС вносят НГШ и ЗНГШ по представлению лица, применившего увольнение. Если статья предусматривает «Увольнение + ЧС», лицо, применившее увольнение, в течение 24 часов направляет представление НГШ или ЗНГШ.\n2.3.2. Командир подразделения (для курсантов - Начальник УТЦ) самостоятельно вносит в ЧС с лишением присвоенного звания военнослужащего, уволившегося по собственному желанию, не завершив Академию либо поставленную задачу.\n\n2.4. Командир не вправе наказывать личный состав другого подразделения. Обнаружив нарушение, он фиксирует его и передаёт материалы Военной полиции либо командиру нарушителя.\n\n2.5. Порядок применения взыскания:\n1) зафиксировать нарушение (видеозапись, скриншоты, рапорт);\n2) предоставить военнослужащему возможность дать объяснение и представить доказательства. Отказ от дачи объяснений не является проступком и не влечёт взыскания;\n3) принять решение с указанием пункта устава и вида взыскания;\n4) объявить взыскание военнослужащему;\n5) внести запись в журнал взысканий.\n\n2.6. Дисциплинарное взыскание применяется не позднее одного месяца со дня обнаружения проступка в соответствии со статьёй 30 Трудового кодекса РО. При установлении внутренним регламентом более короткого срока применения взыскания такой срок не может быть менее 72 часов с момента обнаружения проступка. Проведение служебной проверки не отменяет установленный законом предельный срок.\n\n2.7. Материалы, послужившие основанием для взыскания, хранятся не менее 72 часов, а при подаче жалобы - до её рассмотрения. Отсутствие материалов является основанием для отмены взыскания.\n\n2.8. Генералитет:\n2.8.1. Нарушения генералитета Военная полиция фиксирует и передаёт НГШ. Нарушения НГШ - Министру обороны РО и в Прокуратуру РО.\n2.8.2. Понижение в должности генералитета применяет НГШ, а в отношении НГШ - Министр обороны РО или Премьер-министр РО.\n\n2.9. Запрещено применять взыскание за подачу жалобы или апелляции, обращение в Прокуратуру или Следственный комитет РО, а также за отказ исполнить заведомо незаконный приказ."},{"t":"РАЗДЕЛ 3. ВИДЫ ВЗЫСКАНИЙ, ИХ ОТРАБОТКА И СНЯТИЕ","b":"3.1. Активное взыскание - выговор или переаттестация, которые не сняты в порядке настоящего Раздела. Предупреждение активным взысканием не считается.\n\n3.2. Предупреждение - устное или письменное указание на допущенный проступок. Фиксируется в журнале взысканий, не препятствует повышению. Погашается автоматически через 72 часа, если военнослужащий не допустил нового нарушения.\n\n3.3. Выговор:\n3.3.1. Снимается после отработки индивидуального задания.\n3.3.2. Задание назначает лицо, наложившее выговор, либо Военная полиция в течение 24 часов с момента выговора. Срок выполнения - до 72 часов. Выполнение принимает лицо, назначившее задание.\n3.3.3. Если задание не назначено в течение 24 часов, выговор снимается по заявлению военнослужащего лицом, наложившим его, либо Военной полицией.\n3.3.4. Выговор, не отработанный в срок, остаётся активным до отработки.\n3.3.5. Выговор, наложенный Прокуратурой РО, действует в течение установленного Прокуратурой срока от 1 до 7 дней, досрочно не снимается и погашается по истечении указанного срока в соответствии с примечанием к статье 30.1 Трудового кодекса РО. До погашения учитывается как активный выговор.\n3.3.6. При наличии активного выговора военнослужащий не может быть повышен в звании или должности, представлен к поощрению и переведён в другое подразделение.\n3.3.7. Наличие трёх активных выговоров может рассматриваться как систематическое нарушение служебной дисциплины и является основанием для рассмотрения вопроса об увольнении по подпункту «а» статьи 43 Трудового кодекса РО, но не влечёт автоматического увольнения. Решение принимается с учётом обстоятельств проступков и требований законодательства.\n\n3.4. Понижение в должности:\n3.4.1. Понижение в должности осуществляется путём назначения военнослужащего на нижестоящую должность. Для определения возможного снижения воинского звания используется понятие «ступень»: одна ступень - одно воинское звание; понижение на N ступеней означает понижение на N воинских званий.\n3.4.2. Понижение в должности командира подразделения или его заместителя влечёт освобождение от соответствующей руководящей должности и назначение на нижестоящую должность в установленном порядке.\n3.4.3. При снижении воинского звания военнослужащего ниже звания «Младший сержант» он возвращается в Академию в установленном порядке.\n3.4.4. Решение о понижении в должности исполняется в установленном порядке с момента вступления в силу. Очередное повышение - по общей системе повышения, не ранее чем через 72 часа.\n\n3.5. Обязательная переаттестация:\n3.5.1. Устный экзамен по уставам ВС РО и законодательству РО, связанным со службой аттестуемого.\n3.5.2. Принимает Военная полиция; у курсантов - инструкторы УТЦ.\n3.5.3. На прохождение отводится 72 часа с момента назначения, предоставляется 2 попытки.\n3.5.4. Во время переаттестации военнослужащий продолжает службу, но не может быть повышен.\n3.5.5. Обязательная переаттестация считается исполненной с момента успешной сдачи. При неявке или несдаче в установленный срок военнослужащий может быть уволен при наличии оснований, предусмотренных статьёй 43 Трудового кодекса РО, с соблюдением установленной процедуры. Автоматическое увольнение не допускается.\n\n3.6. Увольнение - прекращение контракта со сдачей табельного оружия, снаряжения и имущества.\n\n3.7. Чёрный список ВС РО:\n3.7.1. Применяется только вместе с увольнением - за существенные нарушения уставов, преступления и случаи, указанные в пункте 2.3.2 ДУ.\n3.7.2. Решение о внесении в ЧС должно быть обосновано и может быть обжаловано.\n3.7.3. Лицо, внесённое в ЧС, не может заключить контракт с ВС РО и восстановиться на службе до исключения из списка.\n\n3.8. Отмена взыскания руководством ВС РО: НГШ и ЗНГШ вправе отменить любое внутреннее дисциплинарное взыскание, кроме взысканий, наложенных Прокуратурой РО, и взысканий за проступки с признаками преступления."},{"t":"РАЗДЕЛ 4. ОБЖАЛОВАНИЕ","b":"4.1. Взыскание может быть обжаловано в течение 72 часов с момента его применения.\n\n4.2. Жалоба подаётся:\n- на взыскание командира подразделения или инструктора - руководству Военной полиции или куратору направления;\n- на взыскание Военной полиции - Начальнику Управления военной полиции и дисциплины, а на его решения - НГШ или ЗНГШ;\n- на взыскание начальника управления - НГШ или ЗНГШ;\nПрокуратура РО вправе проверить законность любого взыскания в любое время по своей инициативе.\n\n4.3. Жалобу не может рассматривать лицо, наложившее взыскание.\nИсключение: НГШ, положительное решение в сторону лица обжалующего взыскание\n\n4.4. Жалоба рассматривается в течение 48 часов. Для рассмотрения вызываются военнослужащий, подавший жалобу, лицо, наложившее взыскание, и при необходимости командир подразделения.\n\n4.5. По итогам взыскание оставляется в силе, смягчается или отменяется. При отмене взыскания военнослужащий восстанавливается в прежнем звании и должности, запись о взыскании аннулируется.\n\n4.6. Подача жалобы не приостанавливает исполнение взыскания. Рассматривающий жалобу вправе приостановить его до вынесения решения.\n\n4.7. Повторная жалоба по тому же вопросу без новых доказательств не рассматривается."},{"t":"РАЗДЕЛ 5. СЛУЖЕБНАЯ ПРОВЕРКА","b":"5.1. Служебную проверку проводит Военная полиция по рапорту, жалобе или самостоятельно обнаруженному нарушению. Срок проверки - не более 7 суток.\n\n5.2. Военнослужащий, вызванный Военной полицией, обязан явиться в течение 24 часов, если не имеет уважительной причины, о которой заранее сообщил ВП. Давать объяснения - право военнослужащего, а не обязанность; отказ от объяснений не является проступком.\n\n5.3. На время служебной проверки НГШ или ЗНГШ по представлению командира вправе отстранить военнослужащего от службы на срок до 7 суток. На время отстранения военнослужащий не исполняет служебные обязанности, а командование не вправе этого требовать.\n\n5.4. По итогам проверки ВП выносит заключение: взыскание, передача материалов в Прокуратуру, Следственный комитет, МВД или ФСБ либо прекращение проверки.\n\n5.5. В рамках служебной проверки наручники и удержание к военнослужащему не применяются."},{"t":"РАЗДЕЛ 6. ВОЕННОСЛУЖАЩИМ ЗАПРЕЩЕНО","b":"ОБЩАЯ ДИСЦИПЛИНА И ЭТИКА\n\n6.1. Несоблюдение субординации и уставных форм общения, в том числе на плацу и КПП.\nНаказание: Предупреждение / Выговор\n\n6.2. Оскорблять гражданских лиц, военнослужащих и государственных служащих; использовать нецензурную брань при исполнении.\nНаказание: Выговор / Переаттестация / Понижение на 1-2 ступени\nПримечание: публичное оскорбление представителя власти содержит признаки преступления - материалы передаются в МВД или Следственный комитет.\n\n6.3. Обманывать, вводить в заблуждение командование.\nНаказание: Выговор / Понижение на 1-3 ступени / Увольнение\n\n6.4. Выпрашивать повышение, звание или должность у старшего состава.\nНаказание: Предупреждение / Выговор\n\n6.5. Иметь связи с преступными группировками. При попытке вербовки военнослужащий обязан немедленно доложить командованию.\nНаказание: Увольнение + ЧС\nПримечание: материалы передаются в ФСБ.\n\n6.6. Хранить, употреблять, распространять наркотические и психотропные вещества; являться на службу в состоянии алкогольного или наркотического опьянения.\nНаказание: Увольнение / Увольнение + ЧС\nПримечание: материалы передаются в МВД.\n\n6.7. Не исполнять законный приказ, в том числе не являться на построение.\nНаказание: Выговор / Понижение на 1-2 ступени / Переаттестация\nПримечание: отказ исполнить заведомо незаконный приказ нарушением не является. Неисполнение приказа, причинившее существенный вред интересам службы, содержит признаки преступления.\n\n6.8. Превышать полномочия или злоупотреблять ими.\nНаказание: Выговор / Понижение на 1-3 ступени / Увольнение\n\n6.9. Халатность - неисполнение или ненадлежащее исполнение служебных обязанностей по небрежности или недобросовестности.\nНаказание: Выговор / Понижение на 1-3 ступени / Увольнение\nПримечание: при крупном ущербе или существенном нарушении прав граждан материалы передаются в Прокуратуру РО.\n\nСЛУЖЕБНОЕ ВРЕМЯ\n\n6.10. Бездействовать на территории воинской части в рабочее время.\nНаказание: Предупреждение / Выговор\nИсключения: курилка (в пределах пункта 5.9 УВС), перерыв, генералитет.\n\n6.11. Покидать территорию воинской части в рабочее время без разрешения, увольнительного или уведомления (для комсостава).\nНаказание: Выговор / Понижение на 1-2 ступени / Увольнение\nИсключения: служебные задачи, приказ командования, генералитет и комсостав в порядке пункта 5.4 УВС.\nПримечание: если оставление места службы повлекло существенные последствия, материалы передаются через ВП в Прокуратуру РО.\n\n6.12. Отсутствовать на службе без уважительной причины и без уведомления командования 7 рабочих дней и более. Отпуск, отгул, лечение и отстранение отсутствием не считаются.\nНаказание: Увольнение\nПримечание: при признаках самовольного оставления части или дезертирства материалы передаются через ВП в Прокуратуру РО.\n\n6.13. Не являться на вечернюю поверку без уважительной причины.\nНаказание: Предупреждение / Выговор\n\n6.14. Превышать установленное время перерыва или увольнительного.\nНаказание: Предупреждение / Выговор\n\n6.15. Находиться в казино в рабочее время.\nНаказание: Выговор\nИсключения: увольнительное время, отпуск, окончание рабочего дня.\n\nСТРОЙ\n\n6.16. Разговаривать и пользоваться телефоном в строю.\nНаказание: Предупреждение / Выговор\nИсключение: обращение проводящего построение к военнослужащему и ответ ему.\n\n6.17. Самовольно покидать строй.\nНаказание: Выговор / Понижение на 1-2 ступени\n\n6.18. Совершать в строю посторонние действия (танцы, разминки, жесты).\nНаказание: Выговор / Понижение на 1-3 ступени\n\n6.19. Спать в строю, бездействовать и не реагировать на команды.\nНаказание: Выговор / Понижение на 1-2 ступени\n\n6.20. Использовать микрофон на плацу без веской причины, оставлять на плацу посторонние предметы.\nНаказание: Предупреждение / Выговор\n\nОРУЖИЕ, ИМУЩЕСТВО, ТЕХНИКА\n\n6.21. Продавать, дарить или передавать любое оружие гражданским лицам, а табельное оружие, боеприпасы и снаряжение - любым посторонним лицам.\nНаказание: Увольнение + ЧС\nПримечание: материалы передаются в МВД или ФСБ.\n\n6.22. Направлять оружие на безоружного, применять оружие без оснований, предусмотренных пунктом 4.4 УВС.\nНаказание: Выговор / Понижение на 1-3 ступени / Увольнение\nПримечание: при причинении вреда материалы передаются в Следственный комитет.\n\n6.23. Пренебрежительно обращаться с оружием и специальными средствами, не сдавать на склад оружие, полученное в ходе перестрелок, носить служебное оружие открыто вне службы.\nНаказание: Выговор / Понижение на 1-2 ступени\nПримечание: пренебрежительное отношение к оружию, повлёкшее существенные последствия, содержит признаки халатности - материалы передаются в Прокуратуру РО.\n\n6.24. Присваивать чужое имущество при досмотре или обыске, похищать имущество со склада.\nНаказание: Увольнение + ЧС\nПримечание: материалы передаются в МВД.\n\n6.25. Класть на склад личные вещи и мусор (одежда, еда, рыболовные принадлежности, электроприборы и т.п.), сломанную амуницию (тяжёлые бронежилеты прочностью ниже 90%, лёгкие - ниже 40%).\nНаказание: Предупреждение / Выговор\nПримечание: за помещение на склад нелегальных предметов - Увольнение, материалы передаются в МВД.\n\n6.26. Использовать служебную технику не по назначению или в личных целях.\nНаказание: Выговор / Понижение на 1-2 ступени\n\n6.27. Умышленно или по неосторожности повреждать и уничтожать оружие, технику и имущество ВС РО.\nНаказание: Выговор / Понижение на 1-3 ступени / Увольнение\nПримечание: при значительном ущербе материалы передаются в Следственный комитет.\n\n6.28. Превышать скорость, установленную пунктом 6.6 УВС на территории воинской части, обгонять колонну, отклоняться от маршрута ведущего колонны.\nНаказание: Предупреждение / Выговор\nИсключения: колонна поставки, тревога, техника поддержки, приказ, неисправность ведущей машины.\n\n6.29. Использовать лётную технику без допуска руководства ВС РО.\nНаказание: Выговор / Понижение на 1-2 ступени\n\n6.30. Передвигаться на личном транспорте по территории воинской части, парковаться вне отведённой парковки.\nНаказание: Предупреждение / Выговор\nИсключение: генералитет.\n\nФОРМА И ВНЕШНИЙ ВИД\n\n6.31. Носить форму не своего подразделения, погоны не своего звания.\nНаказание: Выговор / Понижение на 1-3 ступени\nИсключения: специальные операции, тренировки, приказ командования.\n\n6.32. Находиться на территории воинской части в рабочее время в гражданской одежде.\nНаказание: Предупреждение / Выговор\nИсключения: генералитет, выход по увольнительному, служебная задача, требующая иного.\n\n6.33. Нарушать требования к внешнему виду (стрижка, причёска).\nНаказание: Предупреждение\n\n6.34. Носить маску с нарушением пункта 6.3 УВС, отказываться снять маску по законному требованию.\nНаказание: Выговор\n\nРЕЖИМ И ВОЕННАЯ ТАЙНА\n\n6.35. Пропускать на территорию воинской части лиц без права доступа, приглашать лиц, не имея на это права, оставлять приглашённых без сопровождения.\nНаказание: Выговор / Понижение на 1-3 ступени / Увольнение\nПримечание: из числа военнослужащих приглашать лиц на территорию воинской части вправе только комсостав и генералитет - с непрерывным сопровождением приглашённого до выхода с территории.\n\n6.36. Разглашать государственную тайну: расположение ВС РО, сведения о перевозке вооружения, специальных средств и материалов (в том числе время и маршруты поставок), документы военной разведки, сведения о военнослужащих, выполнявших специальные задания по противодействию терроризму или обеспечению безопасности лиц, в отношении которых принято решение о применении мер государственной защиты.\nНаказание: Увольнение + ЧС\nПримечание: материалы передаются в ФСБ.\n\n6.37. Разглашать служебную информацию ВС РО: коды и каналы связи, внутренние процедуры, численный состав подразделений, персональные данные военнослужащих.\nНаказание: Выговор / Понижение на 1-3 ступени / Увольнение\n\n6.38. Отходить при погрузке и разгрузке материалов от грузовиков дальше 3 метров, взаимодействовать с материалами без приказа и вне колонны.\nНаказание: Выговор / Увольнение\nПримечание: при хищении материалов - Увольнение + ЧС, материалы передаются в МВД.\n\n6.39. Самовольно покидать канал специальной связи ВС РО.\nНаказание: Выговор / Увольнение\n\nДОКУМЕНТЫ И ОТЧЁТНОСТЬ\n\n6.40. Некорректно оформлять отчёты и документы.\nНаказание: Предупреждение / Выговор\n\n6.41. Подделывать отчёты, использовать свои или чужие ранее использованные материалы, мошенничать в кадровых отчётах.\nНаказание: Увольнение / Увольнение + ЧС\n\n6.42. Удалять или редактировать отчёты и заявления после отправки, изменять сроки отпуска после одобрения.\nНаказание: Выговор\n\n6.43. Продавать военные билеты, ускорять прохождение КМБ или Академии за вознаграждение, брать вознаграждение за повышение.\nНаказание: Увольнение + ЧС\nПримечание: материалы передаются в Прокуратуру РО.\n\nПРАВОПОРЯДОК\n\n6.44. Задерживать лиц курсанту Академии или гражданину, проходящему КМБ.\nНаказание: Выговор / Переаттестация / Понижение на 1-2 ступени\nПримечание: при заведомо незаконном задержании материалы передаются в Следственный комитет.\n\n6.45. Применять наручники и удерживать военнослужащего в рамках дисциплинарного разбирательства.\nНаказание: Выговор / Понижение на 1-2 ступени\n\n6.46. Не передавать задержанного Военной полиции или правоохранительным органам, допрашивать или наказывать задержанного.\nНаказание: Выговор / Понижение на 1-3 ступени / Увольнение\n\n6.47. Препятствовать законной деятельности МВД, ГИБДД, ФСБ, ФСО, Следственного комитета, Прокуратуры РО, Военной полиции и Медицинской роты (недопуск, отказ от освидетельствования, срыв проверки).\nНаказание: Выговор / Увольнение\n\n6.48. Не являться по вызову Военной полиции на служебную проверку в течение 24 часов без уважительной причины.\nНаказание: Выговор; при повторной неявке - Увольнение\n\n6.49. Нести службу с просроченной медицинской справкой, отказываться от медицинского освидетельствования Медицинской ротой.\nНаказание: Предупреждение / Выговор\n\n6.50. Переводиться в другое подразделение до звания «Ст.Сержант».\nНаказание: Выговор\nПримечание: наказание по этому пункту несёт и командир, осуществивший перевод.\nИсключение: не распространяется на распределение выпускника Академии в ОВО по п. 8.2.4 УВС\nИсключение: Одобрение НГШ или ЗНГШ.\n\n6.51. Вмешиваться в работу других подразделений.\nНаказание: Выговор / Понижение на 1-2 ступени\n\n6.52. Досматривать, обыскивать и задерживать лиц, обладающих статусом неприкосновенности, вне случаев, предусмотренных законом; не давать задержанному возможности подтвердить статус неприкосновенности.\nНаказание: Выговор / Понижение на 1-3 ступени\n\n6.53. Не исполнять распоряжения в период чрезвычайного и военного положения, нарушать порядок Раздела 12 УВС.\nНаказание: Выговор / Понижение на 1-3 ступени / Увольнение\nПримечание: нарушение режима чрезвычайного и военного положения влечёт уголовную ответственность - материалы передаются в ФСБ."},{"t":"РАЗДЕЛ 7. ДОЛЖНОСТНЫМ ЛИЦАМ ЗАПРЕЩЕНО","b":"(комсоставу, инструкторам, Военной полиции, генералитету)\n\n7.1. Применять взыскания, не предусмотренные ДУ, в том числе штрафы.\nНаказание: Выговор / Понижение на 1-3 ступени\n\n7.2. Наказывать личный состав других подразделений без права на это.\nНаказание: Выговор\n\n7.3. Отказывать в увольнении по собственному желанию либо затягивать увольнение более 48 часов с момента подачи рапорта.\nНаказание: Выговор / Понижение на 1-2 ступени\n\n7.4. Исполнять рапорт об увольнении военнослужащего, в отношении которого возбуждено дело или ведётся расследование Прокуратуры или Следственного комитета РО.\nНаказание: Понижение на 1-3 ступени / Увольнение\nПримечание: материалы передаются в Прокуратуру РО.\n\n7.5. Отзывать военнослужащего из отпуска, отгула, увольнительного или перерыва, вызывать на службу во внеслужебное время без оснований, указанных в пункте 5.8 УВС.\nНаказание: Выговор\n\n7.6. Наказывать за жалобу, апелляцию, обращение в Прокуратуру или Следственный комитет, отказ исполнить заведомо незаконный приказ.\nНаказание: Понижение на 1-3 ступени / Увольнение\n\n7.7. Не сохранять материалы, послужившие основанием взыскания, в течение 72 часов.\nНаказание: Выговор\nПримечание: взыскание, наложенное без сохранённых материалов, отменяется.\n\n7.8. Отдавать заведомо незаконные приказы.\nНаказание: Понижение на 1-3 ступени / Увольнение\n\n7.9. Вносить или представлять военнослужащих к внесению в ЧС без обоснования.\nНаказание: Выговор / Понижение на 1-2 ступени\n\n7.10. Укрывать нарушения подчинённых, не передавать материалы о признаках преступления в компетентные органы.\nНаказание: Понижение на 1-3 ступени / Увольнение\n\n7.11. Использовать подчинённых в личных целях, принуждать к работе, не связанной со службой.\nНаказание: Выговор / Понижение на 1-2 ступени"},{"t":"Глава 3. Виды взысканий","b":"3.1. За дисциплинарный проступок может быть назначено только одно из следующих взысканий:\n3.1.1. предупреждение;\n3.1.2. выговор;\n3.1.3. понижение в должности;\n3.1.4. обязательная переаттестация;\n3.1.5. увольнение с военной службы.\n3.2. Несколько действующих взысканий, повторность или систематичность являются отягчающими обстоятельствами, но не влекут автоматического преобразования взысканий, понижения либо увольнения.\n3.3. Каждый дисциплинарный проступок рассматривается как уникальное нарушение и взыскание за одинаковые дисциплинарные проступки возможны разные.\n3.3.1 Вид взысканий за дисциплинарный проступок устанавливается Генералом и его заместителями, комендантом, куратором, командиром и его заместители. Военнослужащие ВП выдают взыскания с согласования с куратором, командиром, заместителями командира подразделения ВП.\n3.4. Генерал и его заместители, комендант, куратор, командир подразделения и его заместители,  вправе назначать все предусмотренные настоящим Уставом взыскания в пределах полномочий и законодательства РО.\n3.5. Командир Военной полиции вправе назначать взыскания военнослужащим до звания Генерал-Майор включительно. Сотрудники отдела ВП могут составлять рапорта на взыскания сотрудникам до должности Подполковника подразделения включительно.\n3.6. До назначения взыскания уполномоченное лицо устанавливает событие проступка, вину, причинную связь, обстоятельства совершения и отсутствие оснований, исключающих ответственность.\n3.7. При выборе меры учитываются тяжесть нарушения, последствия, форма вины, предшествующая служба, действующие взыскания, добровольное устранение вреда, содействие проверке и возможность исправления более мягкой мерой.\n3.8. Военнослужащий знакомится с решением под подпись либо иным подтверждаемым способом не позднее двадцати четырех часов после его принятия. Отказ от ознакомления фиксируется актом.\n3.9. Взыскание не может основываться на общем указании на «нарушение дисциплины» без описания деяния и ссылки на конкретную норму.\n3.10. При малозначительности деяния и отсутствии вреда производство может быть прекращено с устным разъяснением. Такое разъяснение взысканием не является и в реестр не вносится.\n3.11. При отсутствии события, состава или доказанной вины производство прекращается, а введенные ограничения незамедлительно отменяются.\n3.12. Смягчающими обстоятельствами признаются добровольное прекращение нарушения, предотвращение или устранение последствий, возмещение вреда, правдивое признание, содействие проверке, отсутствие действующих взысканий и совершение деяния вследствие исключительной служебной обстановки.\n3.13. Отягчающими обстоятельствами признаются повторность или систематичность, злоупотребление должностью, совершение группой, вовлечение подчиненного, сокрытие следов, продолжение после законного требования прекратить, тяжкие последствия, состояние опьянения и отказ без уважительной причины устранить созданную опасность.\n3.14. Совершение деяния во исполнение приказа учитывается при оценке вины, если приказ не был заведомо незаконным и военнослужащий не мог осознавать его противоправность.\n3.15. Не подлежит взысканию лицо, действовавшее в состоянии крайней необходимости, при оправданном служебном риске либо вследствие непреодолимой силы, если не были превышены необходимые пределы.\n3.16. Командная должность усиливает ответственность, когда нарушение связано с руководством, контролем, примером для подчиненных, распоряжением оружием, имуществом или служебной информацией.\n3.17. Дисциплинарные проступки, определяются главой 8 настоящего устава.\n3.18. Составы проступков охватывают нарушения порядка исполнения приказов и подчиненности; времени службы, построений, постов и заданий; режима военных объектов; обращения с оружием, транспортом и имуществом; связи, отчетности и документов; подготовки и медицинского контроля; этики, законности и кадровой работы.\n3.19. Повторным признается однородный проступок, совершенный в период действия взыскания за предшествующее однородное нарушение.\n3.20 Систематическим признается совершение трех и более однородных нарушений в течение тридцати календарных дней, если каждое из них доказано отдельно.\n3.21. Тяжкими последствиями признаются гибель или вред здоровью, утрата оружия или имущества, разглашение охраняемых сведений, срыв задания, незаконное проникновение на военный объект, существенный ущерб государству либо иное сопоставимое нарушение безопасности.\n3.22 Если одно деяние содержит признаки нескольких составов, применяется норма, наиболее полно описывающая содеянное. Остальные признаки учитываются при выборе взыскания без назначения нескольких взысканий за одно деяние.\n3.23. Пункт приложения о нарушении иной нормы применяется только при точном указании действующей обязанности и не может использоваться для ответственности за поведение, которое не было запрещено или обязательно на момент совершения"}]},{"id":"schedule","title":"Графики мероприятий","short":"Графики","items":[{"t":"Airdrop","b":"00:00, 4:00, 8:00, 12:00, 16:00, 20:00."},{"t":"Похищения","b":"с 10:00 до 2:00"},{"t":"Крафты","b":"в любое время, кроме - с 15:00 до 16:00"}]},{"id":"links","title":"Ссылки","short":"Ссылки","items":[{"t":"Устав внутренней службы (форум)","b":"https://forum.russia.online/threads/ustav-vnutrennei-sluzhby-vooruzhennykh-sil-rossii-onlain.34598/"},{"t":"Устав караульно-постовой службы (форум)","b":"https://forum.russia.online/threads/ustav-karaul-no-postovoi-sluzhby-vooruzhennykh-sil-rossii-onlain.34608/"},{"t":"Дисциплинарный устав (форум)","b":"https://forum.russia.online/threads/distsiplinarnyi-ustav-vooruzhennykh-sil-rossii-onlain.34601/"},{"t":"Анонимные жалобы","b":"Ссылка на форму для анонимных жалоб на военнослужащих: https://forms.gle/eUtncUg2rZgutrNXA"}]},{"id":"umw53erod","title":"Автор памятки","short":"Автор","items":[{"t":"Создатель","b":"Памятку разработал сотрудник ОВО Иван Мельников. Если вы считаете, что информации недостаточно, то напишите мне в личные сообщения DS: forta0_0\nВсех благ)","img":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQB <script>
const PIN = '0670', ADM_SALT = 'd315694779c2ad03dbdc4f39bdf4abe7', ADM_HASH = 'ffc3ff255913eb109a6dc8700e26189446b76b49ffb76895c76d4268644f3ba3';
let admin = false;
const $ = id => document.getElementById(id);
const gate = $('gate'), app = $('app'), card = $('card'), msgEl = $('msg'), main = $('main'), q = $('q');


/* ---------- пин-код ---------- */
let buf = '', tries = 0, lockUntil = 0;
const dots = [...document.querySelectorAll('.dot')];
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k => {
  const b = document.createElement('button');
  if(k === '') { b.style.visibility = 'hidden'; b.disabled = true; }
  else { b.textContent = k; b.onclick = () => press(k === '⌫' ? 'del' : k); }
  $('pad').appendChild(b);
});
function paint(){ dots.forEach((d,i) => d.classList.toggle('on', i < buf.length)); }
function press(k){
  if(Date.now() < lockUntil) return;
  if(k === 'del') buf = buf.slice(0,-1); else if(buf.length < 4) buf += k;
  msgEl.textContent = ''; paint();
  if(buf.length === 4) buf === PIN ? unlock() : fail();
}
function fail(){
  tries++;
  card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 400);
  if(tries >= 5){
    tries = 0; lockUntil = Date.now() + 30000;
    msgEl.textContent = 'Много ошибок. Подожди 30 секунд';
    setTimeout(() => { if(Date.now() >= lockUntil) msgEl.textContent = ''; }, 30000);
  } else msgEl.textContent = 'Неверный код';
  setTimeout(() => { buf = ''; paint(); }, 250);
}
function unlock(){
  try{ sessionStorage.setItem('ok','1'); }catch(e){}
  gate.hidden = true; app.hidden = false; buf = ''; paint(); render(''); sizeHead();
}
function relock(){
  try{ sessionStorage.removeItem('ok'); }catch(e){}
  app.hidden = true; gate.hidden = false; q.value = ''; msgEl.textContent = ''; scrollTo(0,0);
}
document.addEventListener('keydown', e => {
  if(gate.hidden) return;
  if(/^\d$/.test(e.key)) press(e.key); else if(e.key === 'Backspace') press('del');
});
$('lock').onclick = relock;
/* ---------- меню, поиск, редактор ---------- */
const mob = () => matchMedia('(max-width:899px)').matches;
function sizeHead(){ document.documentElement.style.setProperty('--hh', mob() ? $('side').offsetHeight + 'px' : '0px'); }
addEventListener('resize', sizeHead);
const btn = (t, f) => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = t; b.onclick = f; return b; };
let lastOn = null;
function spy(){
  const y = (mob() ? $('side').offsetHeight : 0) + 40; let cur = null;
  document.querySelectorAll('section').forEach(s => { if(s.getBoundingClientRect().top <= y) cur = s.id; });
  [...nav.children].forEach(b => b.classList.toggle('on', 's-' + b.dataset.i === cur));
  if(cur !== lastOn){ lastOn = cur; const a = nav.querySelector('.on'); if(a) a.scrollIntoView({block:'nearest', inline:'nearest'}); }
}
addEventListener('scroll', spy, {passive:true});
function buildNav(){
  nav.textContent = '';
  SECTIONS.forEach((s, n) => {
    const b = document.createElement('button'), i = document.createElement('i');
    i.textContent = String(n + 1).padStart(2, '0'); b.append(i, s.short || s.title); b.dataset.i = s.id;
    b.onclick = () => { if(q.value){ q.value = ''; render(''); } const el = $('s-' + s.id); if(el) el.scrollIntoView(); };
    nav.append(b);
  });
  sizeHead(); spy();
}

const strip = () => SECTIONS.map(s => s.id === 'notes' ? {...s, items: []} : s);
const idb = (m, v) => new Promise(r => { try{
  const o = indexedDB.open('arbat', 1); o.onupgradeneeded = () => o.result.createObjectStore('k');
  o.onsuccess = () => { const s = o.result.transaction('k', m).objectStore('k'); const x = m === 'readwrite' ? s.put(v, 'd') : s.get('d'); x.onsuccess = () => r(x.result); x.onerror = () => r(); };
  o.onerror = () => r(); }catch(e){ r(); } });
const save = () => { idb('readwrite', {v: Date.now(), s: strip()}); render(curTerm()); };
const mv = (a, i, d) => { const j = i + d; if(j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; };

const shrink = f => new Promise(r => { const u = URL.createObjectURL(f), i = new Image();
  i.onload = () => { const k = Math.min(1, 1000 / Math.max(i.width, i.height)), c = document.createElement('canvas');
    c.width = Math.round(i.width * k); c.height = Math.round(i.height * k); c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u); r(c.toDataURL('image/jpeg', .6)); };
  i.onerror = () => r(''); i.src = u; });

function dlg(head, fields, imgs, ok){
  const d = document.createElement('dialog'), h = document.createElement('h3'); h.textContent = head; d.append(h);
  const els = fields.map(x => { const e = document.createElement(x.area ? 'textarea' : 'input'); e.placeholder = x.p; e.value = x.v || '';
    if(x.area) e.rows = 8; if(x.pw) e.type = 'password'; d.append(e); return e; });
  if(imgs){
    const fi = document.createElement('input'), th = document.createElement('div'); fi.type = 'file'; fi.accept = 'image/*'; fi.multiple = true; th.className = 'imgs';
    const paint = () => { th.textContent = ''; imgs.forEach((u, i) => { const w = document.createElement('div'), im = new Image(); w.className = 'th'; im.src = u;
      w.append(im, btn('✕', () => { imgs.splice(i, 1); paint(); })); th.append(w); }); };
    fi.onchange = async () => { for(const f of fi.files){ const u = await shrink(f); if(u) imgs.push(u); } fi.value = ''; paint(); };
    paint(); d.append(fi, th);
  }
  const row = document.createElement('div'); row.className = 'adm-row';
  row.append(btn('Сохранить', () => { ok(els.map(e => e.value.trim())); d.close(); }), btn('Отмена', () => d.close()));
  d.append(row); d.onclose = () => d.remove(); document.body.append(d); d.showModal();
}
function zoom(u){ const d = document.createElement('dialog'), i = new Image(); d.className = 'zoom'; i.src = u; d.append(i);
  d.onclick = () => d.close(); d.onclose = () => d.remove(); document.body.append(d); d.showModal(); }
function imgsEl(a){ const w = document.createElement('div'); w.className = 'imgs';
  a.forEach(u => { const i = new Image(); i.src = u; i.loading = 'lazy'; i.onclick = () => zoom(u); w.append(i); }); return w; }

function itBar(s, it){
  const r = document.createElement('div'), a = s.items; r.className = 'adm-row';
  r.append(btn('▲', () => { mv(a, a.indexOf(it), -1); save(); }), btn('▼', () => { mv(a, a.indexOf(it), 1); save(); }),
    btn('Правка', () => { const im = [...(it.img || [])];
      dlg('Запись', [{p:'Заголовок', v:it.t}, {p:'Текст', v:it.b, area:1}], im, ([t, b]) => { it.t = t; it.b = b; it.img = im; save(); }); }),
    btn('Удалить', () => { if(confirm('Удалить запись?')){ a.splice(a.indexOf(it), 1); save(); } }));
  return r;
}
function secBar(s){
  const r = document.createElement('div'); r.className = 'adm-row sec-bar';
  r.append(btn('+ Запись', () => { const im = [];
      dlg('Новая запись', [{p:'Заголовок'}, {p:'Текст', area:1}], im, ([t, b]) => { if(!t && !b && !im.length) return; s.items.unshift({t, b, img: im}); save(); }); }),
    btn('▲', () => { mv(SECTIONS, SECTIONS.indexOf(s), -1); save(); }), btn('▼', () => { mv(SECTIONS, SECTIONS.indexOf(s), 1); save(); }),
    btn('Название', () => dlg('Раздел', [{p:'Название', v:s.title}, {p:'Короткое имя в меню', v:s.short}], null, ([t, sh]) => { if(t){ s.title = t; s.short = sh || t; save(); } })),
    btn('Удалить раздел', () => { if(confirm('Удалить раздел «' + s.title + '» со всеми записями?')){ SECTIONS.splice(SECTIONS.indexOf(s), 1); save(); } }));
  return r;
}
function exportHtml(){
  const c = document.documentElement.cloneNode(true);
  c.querySelector('#data').textContent = 'let DATA_V=' + Date.now() + ';let SECTIONS=' + JSON.stringify(strip()).replace(/</g, '\\u003c') + ';';
  ['pad', 'nav', 'main', 'msg'].forEach(i => c.querySelector('#' + i).textContent = '');
  c.querySelectorAll('dialog').forEach(e => e.remove());
  c.querySelector('#gate').hidden = false; c.querySelector('#app').hidden = true; c.querySelector('#app').className = '';
  c.querySelector('#card').className = 'card box'; c.querySelectorAll('.dot').forEach(d => d.className = 'dot'); c.removeAttribute('style');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['<!DOCTYPE html>\n' + c.outerHTML], {type:'text/html'}));
  a.download = 'index.html'; a.click();
}
/* ---------- секретный вход ---------- */
const hashPw = async p => { const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:Uint8Array.from(ADM_SALT.match(/../g), x => parseInt(x, 16)), iterations:200000}, k, 256);
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); };
function askAdmin(){
  if(admin) return;
  dlg('Командный доступ', [{p:'Пароль', pw:1}], null, async ([p]) => {
    let ok = false; try{ ok = await hashPw(p) === ADM_HASH; }catch(e){ alert('Нужен https или localhost'); return; }
    if(!ok){ await new Promise(r => setTimeout(r, 2000)); alert('Отказано'); return; }
    admin = true; app.className = 'adm'; render(curTerm());
  });
}
let tp = []; $('ttl').onclick = () => { const n = Date.now(); tp = tp.filter(t => n - t < 4000); tp.push(n); if(tp.length >= 7){ tp = []; askAdmin(); } };
addEventListener('keydown', e => { if(e.ctrlKey && e.shiftKey && e.code === 'KeyA' && !app.hidden) askAdmin(); });
$('bar').append(btn('+ Раздел', () => dlg('Новый раздел', [{p:'Название'}, {p:'Короткое имя в меню'}], null, ([t, sh]) => { if(!t) return;
    const n = SECTIONS.findIndex(s => s.id === 'notes'), o = {id:'u' + Date.now().toString(36), title:t, short:sh || t, items:[]};
    n < 0 ? SECTIONS.push(o) : SECTIONS.splice(n, 0, o); save(); })),
  btn('Скачать index.html', exportHtml), btn('Выйти', () => { admin = false; app.className = ''; render(curTerm()); }));

const norm = s => s.toLowerCase().replace(/ё/g, 'е');
function fill(el, text, term){
  text.split(/(https?:\/\/\S+)/).forEach((p, i) => {
    if(i % 2){ const a = document.createElement('a'); a.href = p; a.target = '_blank'; a.rel = 'noopener noreferrer'; hl(a, p, term); el.append(a); }
    else hl(el, p, term);
  });
}
function hl(el, text, term){
  if(!term){ el.append(text); return; }
  const low = norm(text); let i = 0, j;
  while((j = low.indexOf(term, i)) !== -1){
    el.append(text.slice(i, j));
    const m = document.createElement('mark'); m.textContent = text.slice(j, j + term.length); el.append(m);
    i = j + term.length;
  }
  el.append(text.slice(i));
}

/* ---------- заметки (хранятся в этом браузере) ---------- */
let notes = [], draft = {t:'', b:''}, storeOk = true;
try{ notes = JSON.parse(localStorage.getItem('arbat-notes') || '[]'); if(!Array.isArray(notes)) notes = []; }catch(e){ notes = []; }
function saveNotes(){ try{ localStorage.setItem('arbat-notes', JSON.stringify(notes)); storeOk = true; }catch(e){ storeOk = false; } }
function curTerm(){ return norm(q.value.trim()); }
function addNote(){
  const t = draft.t.trim(), b = draft.b.trim();
  if(!t && !b) return;
  notes.unshift({id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), t, b, d: Date.now()});
  draft = {t:'', b:''}; saveNotes(); render(curTerm());
}
function delNote(id){ notes = notes.filter(n => n.id !== id); saveNotes(); render(curTerm()); }
function noteForm(){
  const f = document.createElement('div'); f.className = 'form box';
  const t = document.createElement('input'); t.placeholder = 'Заголовок (необязательно)'; t.maxLength = 120; t.value = draft.t; t.oninput = () => draft.t = t.value;
  const b = document.createElement('textarea'); b.placeholder = 'Текст заметки'; b.rows = 4; b.value = draft.b; b.oninput = () => draft.b = b.value;
  const row = document.createElement('div'); row.className = 'row';
  const s = document.createElement('button'); s.className = 'btn'; s.textContent = 'Сохранить заметку'; s.onclick = addNote;
  const h = document.createElement('span'); h.className = 'hint';
  h.textContent = storeOk ? 'Заметки хранятся только в этом браузере.' : 'Браузер не даёт сохранять: заметки пропадут после закрытия.';
  row.append(s, h); f.append(t, b, row); return f;
}
function noteMeta(it){
  const m = document.createElement('div'); m.className = 'meta';
  const d = document.createElement('span'); d.textContent = new Date(it.d).toLocaleString('ru-RU', {dateStyle:'short', timeStyle:'short'});
  const x = document.createElement('button'); x.className = 'btn'; x.textContent = 'Удалить';
  x.onclick = () => {
    if(x.dataset.s){ delNote(it.id); return; }
    x.dataset.s = '1'; x.textContent = 'Точно удалить?';
    setTimeout(() => { x.dataset.s = ''; x.textContent = 'Удалить'; }, 3000);
  };
  m.append(d, x); return m;
}
function render(term){
  const ns = SECTIONS.find(x => x.id === 'notes'); if(ns) ns.items = notes;
  main.textContent = ''; let hits = 0;
  for(const s of SECTIONS){
    const titleHit = term && norm(s.title).includes(term);
    const list = !term || titleHit ? s.items : s.items.filter(it => norm(it.t + ' ' + it.b).includes(term));
    if(term && !titleHit && !list.length) continue;
    hits++;
    const sec = document.createElement('section'); sec.id = 's-' + s.id;
    const h = document.createElement('h2'), name = document.createElement('span'), cnt = document.createElement('span');
    hl(name, s.title, term); cnt.textContent = list.length; h.append(name, cnt); sec.append(h);
    const isN = s.id === 'notes'; if(isN && !term) sec.append(noteForm());
    if(admin && !isN) sec.append(secBar(s));
    if(!list.length){ const e = document.createElement('div'); e.className = 'empty'; e.textContent = isN ? 'Заметок пока нет.' : 'Раздел пока пуст.'; sec.append(e); }
    const grid = document.createElement('div'); grid.className = 'grid'; sec.append(grid);
    for(const it of list){
      const d = document.createElement('article'); d.className = 'item box';
      const t = document.createElement('h3'); hl(t, it.t || '', term);
      const b = document.createElement('div'); b.className = 'txt'; fill(b, it.b || '', term);
      const ex = document.createElement('div');
      if(it.img && it.img.length) ex.append(imgsEl(it.img));
      if(admin && !isN) ex.append(itBar(s, it));
      if(!isN && it.b && it.b.length > 700){
        const dt = document.createElement('details'); dt.className = 'item box long';
        dt.open = !!term && norm((it.t || '') + ' ' + it.b).includes(term);
        const sm = document.createElement('summary'); hl(sm, it.t || '', term);
        dt.append(sm, b, ex); grid.append(dt); continue;
      }
      if(it.t) d.append(t); if(it.b) d.append(b); d.append(ex);
      if(isN) d.append(noteMeta(it));
      grid.append(d);
    }
    main.append(sec);
  }
  if(!hits){ const n = document.createElement('div'); n.className = 'none box'; n.textContent = 'Ничего не найдено.'; main.append(n); }
  buildNav();
}
q.addEventListener('input', () => render(norm(q.value.trim())));
$('up').onclick = () => scrollTo(0, 0);
let ok = false; try{ ok = sessionStorage.getItem('ok') === '1'; }catch(e){}
idb('readonly').then(d => { if(d && d.v >= DATA_V && Array.isArray(d.s)) SECTIONS = d.s; if(ok) unlock(); });
</script>
