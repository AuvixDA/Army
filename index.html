<style>
:root{--bg:#12140e;--panel:#1a1d14;--card:#20241a;--line:#3b4130;--text:#ecebdd;--muted:#a9ad98;--accent:#59702f;--khaki:#c2b672;--mark:#8a6d1f;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--body:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--mono:'Consolas','Menlo','Courier New',monospace}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);font-size:16px;--hh:0px}
@media(min-width:1700px){html{font-size:19px}}@media(min-width:2300px){html{font-size:25px}}
*,*::before,*::after{box-sizing:inherit;border-radius:0!important;box-shadow:none!important}
[hidden]{display:none!important}
body{margin:0;font:1rem/1.45 var(--body);color:var(--text);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--khaki);outline-offset:1px}
.box{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent)}
.btn{background:var(--bg);border:1px solid var(--line);padding:5px 10px;cursor:pointer;font:600 .8rem var(--mono);text-transform:uppercase;letter-spacing:.05em}
.btn:active,.pad button:active{background:var(--accent)}
#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:21rem;padding:1.2rem 1rem;text-align:center}
.card h1{font:700 1.15rem var(--mono);text-transform:uppercase;letter-spacing:.15em;margin:0 0 6px}
.card p{margin:0 0 14px;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:12px;margin-bottom:10px}
.dot{width:1.1rem;height:1.1rem;border:2px solid var(--line)}.dot.on{background:var(--khaki);border-color:var(--khaki)}
#msg{min-height:24px;margin-bottom:8px;color:var(--khaki);font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{height:3.6rem;font:600 1.3rem var(--mono);background:var(--bg);border:1px solid var(--line);cursor:pointer}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
/* меню */
#side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:2px solid var(--accent);padding:8px 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.top h1{font:700 1.05rem/1.2 var(--mono);letter-spacing:.2em;margin:0;cursor:default;user-select:none;-webkit-user-select:none}
.top small{display:block;font:400 .72rem var(--body);letter-spacing:0;color:var(--muted);margin-top:3px}
#q{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--line)}
#q::placeholder{color:var(--muted)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
nav button{flex:none;background:var(--bg);border:1px solid var(--line);padding:4px 9px;cursor:pointer;white-space:nowrap;font:600 .8rem var(--mono);text-transform:uppercase;letter-spacing:.05em;text-align:left}
nav button i{font-style:normal;color:var(--muted);margin-right:.6em}
nav button.on{border-color:var(--khaki);color:var(--khaki)}
#bar{display:none;gap:6px;margin-top:8px}
.adm #bar{display:flex;flex-wrap:wrap}.adm #side{border-bottom-color:var(--khaki)}
@media(min-width:900px){
#side{position:fixed;inset:0 auto 0 0;width:17rem;overflow-y:auto;display:flex;flex-direction:column;border:0;border-right:2px solid var(--accent);padding:16px 14px}
.adm #side{border-right-color:var(--khaki)}
nav{flex-direction:column;gap:0;overflow:visible;padding:12px 0;flex:1}
nav button{border:0;border-left:3px solid transparent;background:none;padding:8px 8px;width:100%}
nav button:hover{background:var(--card)}nav button.on{background:var(--card);border-left-color:var(--khaki)}
main{margin-left:17rem;padding:20px 28px 90px!important}
#up{display:none}}
main{padding:12px 12px 90px}
section{margin-bottom:20px;scroll-margin-top:calc(var(--hh) + 10px)}
@media(min-width:900px){section{scroll-margin-top:16px}}
section>h2{font:700 .95rem/1.3 var(--mono);text-transform:uppercase;letter-spacing:.12em;margin:0 0 8px;padding:8px 10px;background:var(--accent);border-left:6px solid var(--khaki);display:flex;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));gap:8px;align-items:start}
.item{padding:.6rem .75rem;margin:0}
.item h3{margin:0 0 4px;font:700 .95rem/1.3 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--khaki);overflow-wrap:anywhere}
.item .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}
.item summary{cursor:pointer;font:700 .95rem/1.3 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--khaki);list-style:none;overflow-wrap:anywhere}
.item summary::-webkit-details-marker{display:none}.item summary::before{content:"+ ";color:var(--muted)}.item[open]>summary::before{content:"– "}
.item.long[open]{grid-column:1/-1}.item.long .txt{margin-top:.6rem;max-width:90ch}
.txt a{color:#b5d98a}
.meta{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.6rem;color:var(--muted);font-size:.8rem}
.form{padding:.7rem;margin-bottom:.8rem;display:grid;gap:.5rem}
.form input,.form textarea,dialog input,dialog textarea{width:100%;padding:.5rem .6rem;background:var(--bg);border:1px solid var(--line)}
.form textarea{resize:vertical;min-height:5rem}.form .row,.adm-row{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.hint{color:var(--muted);font-size:.8rem}
.empty{padding:10px;color:var(--muted);border:1px dashed var(--line)}.none{text-align:center;padding:18px}
mark{background:var(--mark);color:inherit;padding:0 2px}
.imgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:.5rem}
.imgs img{height:6rem;width:auto;max-width:100%;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;display:block}
.adm-row{margin-top:.6rem}.sec-bar{margin:-2px 0 8px}
#up{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--khaki);width:min(94vw,36rem);padding:14px;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.75)}dialog h3{margin:0 0 10px;font:700 1rem var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--khaki)}
dialog input,dialog textarea{margin-bottom:8px;display:block}
dialog.zoom{padding:0;width:auto;border:0;background:none}dialog.zoom img{max-width:96vw;max-height:94vh;display:block}
.th{position:relative}.th .btn{position:absolute;top:2px;right:2px;padding:1px 6px}
</style>

<script id="data">let DATA_V=1793976856093;let SECTIONS=[{"id":"ovo","title":"ОВО — об отделе","short":"ОВО","items":[{"t":"Отдел Вневедомственной Охраны(ОВО)","b":"Отдел вневедомственной охраны (ОВО) - основное подразделение ВС РО. Несёт службу на КПП и наблюдательных вышках, патрулирует территорию воинской части, обеспечивает пропускной режим, заступает в дежурство по части, усиливает численный состав на поставках, дропах и мероприятиях."},{"t":"Основные задачи","b":"• Охрана территории военной части и важных объектов;\n• Контроль пропускного режима;\n• Предотвращение проникновения посторонних лиц;\n• Обеспечение безопасности военнослужащих и имущества;\n• Реагирование на чрезвычайные ситуации и нарушения режима;\n• Взаимодействие с другими подразделениями при выполнении задач.\n• Боевое охранение важных государственных лиц и объектов."},{"t":"Полномочия подразделения","b":"• Осуществлять контроль доступа на охраняемую территорию;\n• Проверять соблюдение требований режима;\n• Запрашивать содействие ССО и Военной Полиции;\n• Докладывать о выявленных нарушениях командованию."},{"t":"Что вас ждёт в ОВО","b":"• Регулярные тренировки и подготовка;\n• Возможность карьерного роста;\n• Получение практических навыков несения службы;\n• Дружный и организованный коллектив;\n• Участие в обеспечении безопасности всей военной части."},{"t":"Требования к кандидатам","b":"• Адекватность и дисциплинированность;\n• Желание развиваться и обучаться;\n• Соблюдение устава и приказов командования;\n• Ответственный подход к несению службы.\n• Быть в звание не меньше чем младший сержант"},{"t":"Подача заявки","b":"Предварительную заявку можно оставить здесь:\n\n╏💼・заявки\n\nОВО — это подразделение для тех, кто готов нести ответственность за безопасность военного объекта и поддерживать порядок в рядах Вооружённых Сил."}]},{"id":"posts","title":"Посты и рация","short":"Посты","items":[{"t":"Памятка ОВО. Доклады в рацию","b":"С 08.10 доклад идёт по Уставу караульно-постовой службы (п. 2.4, 5.1-5.2): «(Пост) | (Код) | Состав: (число)». О состоянии поста докладываем каждые 15 минут на всех постах и в патруле. За час пять докладов: заступил, 15-я, 30-я, 45-я минута, сдал пост. Если обстановка изменилась, докладываем сразу.\n\nКоды: Белый - заступил, Зелёный - спокойно, Серый - покинул пост, Жёлтый - подозрительные лица у поста, Красный - проникновение или одиночное нападение, Чёрный - нападение группы.\n\nКПП\nКПП-1 | Белый | Состав: 3\nКПП-1 | Зелёный | Состав: 3\nКПП-1 | Серый | Состав: 3\n\nВышки ПВ-1...ПВ-8. На вышке один человек.\nПВ-3 | Белый | Состав: 1\nПВ-3 | Зелёный | Состав: 1\nПВ-3 | Серый | Состав: 1\n\nПеший патруль - со звания Сержант, не меньше двоих, и только когда на КПП-1 и КПП-2 стоит хотя бы по одному (п. 8.2-8.3). Старт и финиш на КПП-1.\nПатруль | Белый | Состав: 2\nПатруль | Зелёный | Состав: 2\nПатруль | Серый | Состав: 2\n\nТревога - сразу, со своего поста (п. 7.1):\nКПП-1 | Красный | Состав: 2\nПВ-3 | Чёрный | Состав: 1\nСвой пост при нападении не бросаем: преследуют патруль, ВП и МСБ (п. 7.4)."},{"t":"КПП-1","b":"Основной контрольно-пропускной пункт части. Задача постового: контролировать каждый въезд и выезд, без исключений. На посту от 1 до 8 постовых.\n\nВоеннослужащий ВС РО\nГенералитет не проверяем, если нет распоряжения вышестоящего командования. О прибытии или убытии докладываем в рацию.\nКомсостав по требованию предъявляет удостоверение или военный билет: проверяем личность, звание и принадлежность к комсоставу. Основание - только по регламенту или распоряжению.\nОстальные: удостоверение или военный билет, на выезде в служебное время ещё основание: разрешение на убытие, задание, приказ или конец служебного дня.\nКолонны, спецоперации, тревоги и выезды по коду пропускаем сразу. Личный досмотр военнослужащих не проводим, кроме установленных случаев.\nКурсантов Академии и граждан на КМБ в рабочее время выпускаем только с подтверждённого разрешения инструктора УТЦ или по приказу.\n\nГражданский или сотрудник другой структуры\nОстанавливаем до шлагбаума.\nПредставляемся: «Здравия желаю, (звание) (фамилия), ВС РО».\nПроверяем документы и выясняем цель визита.\nДокладываем в рацию, кто прибыл, его должность и цель.\nЛиц из п. 4.2 УКПС без неприкосновенности можем досмотреть.\nПропускаем или отказываем. Кто вправе пройти, сказано в п. 4.1 и 4.2 УКПС, остальных не пускаем.\n\nНеприкосновенных (министры, судьи, прокуратура при исполнении и другие из п. 4.3.1 УКПС) не досматриваем. Если права прохода у них нет, шлагбаум не открываем и докладываем ДЧ.\n\nГражданские у поста\nВыбежал на проезжую часть: просим отойти, чтобы не было затора.\n\nСпрашивает про призыв: если на КПП-2 есть сотрудники ВА, отправляем к ним, если нет - на ВК рядом с Банком № 4.\n\nНападение или прорыв\nСразу докладываем в рацию: проникновение или одиночное нападение - код «Красный», нападение группой вооружённых лиц - код «Чёрный». Занимаем позицию у своего поста, оружие применяем в порядке п. 4.4 УВС (УКПС п. 7.1-7.3). МВД, ФСБ и ГИБДД постовой не вызывает."},{"t":"КПП-2","b":"Дополнительный контрольно-пропускной пункт с тыльной стороны части. На посту от 1 до 8 постовых.\n\nПорядок проверки, действия с гражданскими и при нападении те же, что на КПП-1."},{"t":"Постовые вышки","b":"Наблюдательный пост: контролируем любое движение вокруг части. На вышке стоит один постовой.\n\nПВ-1 Красная, ПВ-2 Жёлтая, ПВ-3 Зелёная, ПВ-4 Фиолетовая, ПВ-5 Голубая, ПВ-6 Розовая, ПВ-7 Мятная, ПВ-8 Синяя.\n\nГражданский у забора\nПросим отойти. Именно просим: требовать уйти с прилегающей территории только потому, что у человека нет цели визита, постовой не вправе (п. 6.1 УКПС). Спрашивает про призыв: если на КПП-2 есть сотрудники ВА, отправляем к ним, если нет - на ВК рядом с Банком № 4.\n\nПроникновение или нападение\nДокладываем в рацию кодом и остаёмся на вышке. Покидать свой пост ради преследования запрещено, нарушителя ведут патруль, Военная полиция и резерв МСБ по команде ДЧ (п. 7.4 УКПС)."},{"t":"Доклады на любом посту","b":"При заступлении, при уходе и каждые 15 минут: «КПП-1 | Белый | Состав: 2», «ПВ-7 | Зелёный | Состав: 1».\n\nПосты заполняем по порядку: КПП-1, затем КПП-2, затем вышки, затем КПП-3 и КПП-4."}]},{"id":"detain","title":"Задержание на КПП","short":"Задержание","items":[{"t":"Задержание на КПП с 27.10 (УПК РО, УК РО, УКПС). Лист 1 - порядок","b":"Задерживает только боец от звания «Сержант» с наручниками и только на КПП-1 или КПП-2. Курсанты и КМБ не задерживают (УВС, п. 4.3.1).\n\nПорядок:\nНадеть наручники, представиться, назвать причину.\nОружие в руках - отобрать. Личный обыск не проводим (УКПС, п. 6.4).\nЗачитать права по форме ниже, чётко и без спешки (УПК РО, ст. 92 ч. 1 п. «г»).\nДоложить в рацию и вызвать ВП. Сами МВД и ФСБ не вызываем и задержанного не везём (УКПС, п. 7.6 и 7.8).\nПередать ВП. Общий срок - 15 минут с момента задержания, не успели - отпускаем (УПК РО, ст. 92 ч. 9). Срок не действует только при военном положении и в режиме ЧС.\n\nНе задерживаем:\nгосслужащего при исполнении с удостоверением, формой или бодикамерой - останавливаем, проверяем, докладываем ДЧ (УКПС, п. 6.7);\nнеприкосновенных и сотрудников Генпрокуратуры при исполнении - требуем покинуть часть без силы, докладываем ДЧ (УКПС, п. 6.3);\nпо ст. 213.1 УК РО во время нападения на часть, причастных задерживаем после него (ФЗ о статусе территорий, ст. 3.3);\nза маску саму по себе (УПК РО, ст. 91 ч. 4).\n\nЗачитываем:\n\"Вы задержаны по подозрению в совершении преступления, предусмотренного (часть, статья) Уголовного кодекса РО, за (что сделал). Вы имеете право на защиту и вправе вызвать адвоката. Ваши права: знать, в чём вас подозревают; давать объяснения или отказаться от них; пользоваться помощью защитника и сделать звонок до 2 минут; представлять доказательства; заявлять ходатайства и отводы. По вашей просьбе указанные статьи и права будут разъяснены полностью\"."},{"t":"Задержание на КПП. Лист 2 - статьи УК РО","b":"Старые номера (6.4, 12.7, 8.4, 12.4 и другие) с 27.10 не действуют.\n\nЧаще всего на КПП:\nст. 213.1 ч. 1 - незаконное проникновение или нахождение на режимном объекте. Часть за КПП - режимный объект, до КПП состава нет. Должностное лицо через служебное положение - ч. 3;\nст. 319.1 ч. 2 - неповиновение законному требованию военнослужащего, воспрепятствование службе;\nст. 318 ч. 1 - насилие или угроза насилием в отношении представителя власти, ч. 2 - насилие, опасное для жизни;\nст. 319.2 - воспрепятствование задержанию;\nст. 213 ч. 1 - хулиганство, только с признаком, например: насилие или угроза, оружие, группа, сопротивление власти.\n\nНасилие и угрозы:\nст. 105 - убийство;\nст. 111 - тяжкий вред здоровью, ст. 112 - средний;\nст. 119 - угроза убийством или тяжким вредом.\n\nОружие и имущество:\nст. 222 ч. 1 - незаконное оружие, ч. 2 - государственного образца;\nст. 226 - хищение оружия;\nст. 166 ч. 2 - угон государственного транспорта посторонним;\nст. 167 ч. 2 - порча государственного имущества.\n\nТолько после требования:\nст. 319.3 - отвлечение или провокация. Сначала требование прекратить и разъяснение последствий на видео, задерживаем только если продолжил;\nст. 319 ч. 1 - оскорбление представителя власти, только публичное. Наедине - это КоАП, не задерживаем."}]},{"id":"promo","title":"Повышение в ОВО","short":"Повышение","items":[{"t":"Система повышения ОВО. Рядовой состав.","b":"Баллы на повышение и цена работ берутся из общей системы повышения Армии РО: ╏📗・общая-система-баллов\nДля повышения нужны и баллы ступени, и обязательные работы своего ранга. Они тоже приносят баллы и идут в общий счёт."},{"t":"Баллы на повышение","b":"[3] Младший сержант → [4] Сержант - 50\n[4] Сержант → [5] Старший сержант - 50\n[5] Старший сержант → [6] Старшина - 75\n[6] Старшина → [7] Прапорщик - 250\n[7] Прапорщик → [8] Старший прапорщик - 300\n[8] Старший прапорщик → [9] Младший лейтенант - 350\n[9] Младший лейтенант → [10] Лейтенант - 400\n[10] Лейтенант → [11] Старший лейтенант - 600\n[11] Старший лейтенант → [12] Капитан - 600"},{"t":"Баллы за работу","b":"КПП-1, КПП-2, КПП-3 или КПП-4, 1 час - 20\nВышка, 1 час - 10\nУчастие в тренировке, лекции или аттестации - 15\nПобеда в дропе - 50, участие без победы - 25. Нужен скриншот и включённая бодикамера\nМероприятие с полученной благодарностью - до 100\nУчастие в поставке или крафте - 30\nОтбитие ВЧ - 100\nВ один отчёт принимается только одна благодарность.\n\nЗасчитывается только работа в ОВО не старше 7 дней. Сделанное в Академии или другом подразделении не идёт в отчёт."},{"t":"Обязательные работы по ступеням","b":"Работы смотрите по текущему рангу, а не по тому, на который подаёте.\n\nСейчас ранг 3, повышение 3 → 4\nАттестация с инструктором ОВО, она допускает к постам. Сдавшим в Академии на Ефрейторе не нужна.\nКПП-1, 1 час, после аттестации.\nКПП-2, 1 час, после аттестации.\n\nСейчас ранг 4, повышение 4 → 5\nКПП-1, 1 час.\nКПП-2, 1 час.\n\nСейчас ранг 5 или 6, повышение до 6 или 7\nПрослушать обязательную лекцию или любое обучающее мероприятие от инструктора ОВО.\nКПП-1, 1 час.\nКПП-2, 1 час.\n\nСейчас ранг 7 или 8, повышение до 8 или 9\nКПП-1, 2 часа.\nКПП-2, 1 час.\n\nСейчас ранг 9, 10 или 11, повышение до 10, 11 или 12\nДежурный по КПП-1, 1 час.\nДежурный по КПП-2, 1 час."},{"t":"Отчёты на повышение","b":"Отчёт подаётся формой: https://docs.google.com/forms/d/e/1FAIpQLSf389gYuG0jtUd4oOL8YmXdayZIH3vs904CtZpejCj9hmHVQw/viewform\nИли через Справочник ОВО: ╏\n\nГде взять Discord ID\nОткройте Настройки пользователя, раздел «Расширенные».\nВключите «Режим разработчика».\nНажмите ПКМ по своему профилю и выберите «Копировать ID».\nВставьте ID в поле формы.\n\nОстальное есть в Справочнике ОВО по той же ссылке."}]},{"id":"uvs","title":"Устав внутренней службы (УВС)","short":"УВС","items":[{"t":"Вводная часть","b":"Настоящий Устав определяет структуру Вооружённых Сил России Онлайн (далее - ВС РО), права и обязанности военнослужащих, взаимоотношения между ними, полномочия подразделений и должностных лиц, а также правила внутреннего порядка в воинской части.\n\nУставом внутренней службы (далее - УВС) руководствуются все военнослужащие ВС РО независимо от воинского звания, должности и подразделения.\n\nНастоящий Устав наделяется юридической силой после его подписания Генеральным прокурором РО в порядке статьи 28.1 Трудового кодекса РО. Применение положений Устава допускается после его официального опубликования. До подписания и опубликования новой редакции военнослужащие руководствуются последней действующей редакцией."},{"t":"РАЗДЕЛ 1. ОБЩИЕ ПОЛОЖЕНИЯ","b":"1.1. Военная служба - особый вид государственной службы, представляющий собой служебную деятельность граждан РО на воинских должностях в ВС РО, направленную на обеспечение обороны и безопасности России Онлайн.\n\n1.2. Военнослужащий - лицо, заключившее контракт о прохождении военной службы в ВС РО, а также гражданин, проходящий Курс молодого бойца для получения военного билета. Военнослужащий является государственным служащим, а при исполнении служебных обязанностей - представителем власти.\n\n1.3. Военнослужащие ВС РО в служебной деятельности руководствуются (в порядке убывания юридической силы):\n- Конституцией РО;\n- федеральными конституционными законами и федеральными законами РО;\n- указами и распоряжениями Премьер-министра РО;\n- приказами и распоряжениями Министра обороны РО;\n- Уставом внутренней службы (УВС);\n- Дисциплинарным уставом (ДУ);\n- Уставом караульно-постовой службы (УКПС);\n- приказами Генерального штаба и положениями подразделений.\nУставы ВС РО являются локальными нормативными актами ВС РО. Приказы НГШ и командиров обязательны для исполнения в пределах их полномочий.\n\n1.4. Уставы ВС РО не могут противоречить Конституции и законодательству РО. Если положение устава расходится с законом - применяется закон.\nПриказы и положения подразделений не могут противоречить УВС, ДУ и УКПС.\n\n1.5. Незнание уставов ВС РО и законодательства РО не освобождает военнослужащего от ответственности.\n\n1.6. Запрещено использовать неточности и пробелы уставов с целью уйти от ответственности. Официальные разъяснения положений уставов дают Начальник Генерального штаба ВС РО и его заместитель.\n\n1.7. Дисциплинарная ответственность по уставам ВС РО не заменяет уголовную и административную ответственность. Уставами ВС РО не могут устанавливаться штрафы, лишение свободы, арест и иные наказания, назначать которые вправе только уполномоченные органы.\n\n1.8. Действие уставов распространяется на военнослужащих в рабочее время, а во внеслужебное время - в части сохранения государственной тайны и служебной информации, ношения формы и оружия, чести и достоинства военнослужащего.\n\n1.9. Основные термины:\nРуководство ВС РО - Начальник Генерального штаба и его заместитель.\nНачальники управлений - Начальник управления военной полиции и дисциплины, Начальник управления военного образования и подготовки, Начальник управления специальных операций и разведки, Начальник управления координации и взаимодействия.\nРуководство Военной полиции - Начальник Управления военной полиции и дисциплины.\nКомандование военнослужащего - его непосредственный командир и все вышестоящие начальники по линии подчинения.\nКуратор направления - начальник управления, в состав которого входит подразделение (для подразделений, непосредственно подчинённых командиру воинской части, - Командир воинской части).\nУважительная причина - отпуск, отгул, лечение, отстранение, выполнение служебной задачи, вызов в государственный орган, иная причина, о которой военнослужащий заранее уведомил командира и которую командир признал уважительной.\nГосударственная тайна - сведения, отнесённые к ней законом: документы о расположении ВС РО; сведения о перевозке государственного вооружения, специальных средств и материалов (в том числе время и маршруты поставок); документы военной разведки; сведения о военнослужащих, выполнявших специальные задания по противодействию терроризму или обеспечению безопасности лиц, в отношении которых принято решение о применении мер государственной защиты. Документы, содержащие государственную тайну, помечаются «ЗАСЕКРЕЧЕНО».\nСлужебная информация ВС РО - сведения, не являющиеся государственной тайной, но не подлежащие разглашению посторонним: коды и каналы связи, внутренние процедуры, численный состав подразделений, персональные данные военнослужащих.\nФорт - территория воинской части ВС РО."},{"t":"РАЗДЕЛ 2. СТРУКТУРА И ИЕРАРХИЯ ВООРУЖЁННЫХ СИЛ РО","b":"2.1. ВС РО входят в состав Министерства обороны РО. Верховным Главнокомандующим ВС РО является Премьер-министр РО.\nВС РО подчиняются Премьер-министру РО, Вице-премьер-министру РО, Министру обороны РО и Начальнику Генерального штаба ВС РО.\n\n2.2. Во главе ВС РО стоит Начальник Генерального штаба Вооружённых сил (Генерал армии) - высшее должностное лицо и официальный представитель ВС РО.\n\n2.3. Руководство ВС РО составляют:\n- Начальник Генерального штаба ВС РО (далее - НГШ), Генерал армии;\n- Заместитель Начальника Генерального штаба ВС РО (далее - ЗНГШ), Генерал-полковник.\n\n2.4. Подразделения ВС РО:\n\nАкадемия (А) - курсанты: военнослужащие, заключившие контракт и проходящие начальную военную подготовку (звания Рядовой - Ефрейтор). Курсанты изучают уставы и законодательство, проходят строевую, огневую, тактическую и медицинскую подготовку, сдают экзамены и по присвоении звания «Мл.Сержант» распределяются по подразделениям.\n\nУчебно-тренировочный центр (УТЦ, Военная академия) - инструкторский состав ВС РО. Обучает курсантов, проводит Курс молодого бойца, принимает экзамены, проверяет отчёты и производит повышения курсантов, заключает контракты, выдаёт военные билеты, проводит тренировки для всей воинской части.\nПримечание: «Академия» - это курсанты, «УТЦ (Военная академия)» - их инструкторы.\n\nВоенная полиция (ВП) - высший надзорный орган по делам военнослужащих воинской части. Осуществляет надзор за соблюдением уставов и воинской дисциплины, проводит служебные проверки, применяет дисциплинарные взыскания и ведёт воспитательную работу по устранению нарушений, принимает переаттестации, разыскивает дезертиров, задерживает правонарушителей и передаёт их в МВД, ФСБ и иные уполномоченные органы.\n\nОтдел вневедомственной охраны (ОВО) - основное подразделение ВС РО. Несёт службу на КПП и постовых вышках, патрулирует территорию воинской части, обеспечивает пропускной режим, заступает в дежурство по части, усиливает численный состав на поставках, дропах и мероприятиях.\n\nСилы специальных операций (ССО) - обеспечивают воинскую часть материалами, оружием и снаряжением. Организуют и проводят поставки, руководят колоннами поставок, выполняют специальные задачи по приказу руководства ВС РО и начальника Управления специальных операций и разведки.\n\nМотострелковый батальон (МСБ) - линейное боевое подразделение воинской части. Осуществляет боевое охранение колонн и поставок совместно с ССО, является оперативным резервом при нападении на воинскую часть (усиление ОВО), проводит оцепление местности при чрезвычайных ситуациях, военном и чрезвычайном положении по приказу командования, проводит учения, тактическую и огневую подготовку личного состава.\n\nМедицинская рота (МР) - оказывает медицинскую помощь военнослужащим, лечит болезни, проводит реанимацию, медицинское освидетельствование и выдачу медицинских справок, проверяет актуальность медицинских справок личного состава, осуществляет санитарное сопровождение операций и поставок, проводит занятия по тактической медицине.\n\nАвтомобильная рота (АР) - обслуживает автопарк воинской части, ведёт учёт, выдачу и возврат техники, выстраивает технику для поставок, дропов и мероприятий, контролирует использование служебного транспорта.\n\nОтдельный отряд специального назначения (ООСпН) ВС РО - оказывает поддержку на мероприятиях, осуществляет предварительную разведку.\n\nГлавное разведывательное управление (ГРУ) - отдельное подразделение Управления специальных операций и разведки, осуществляющее разведывательную деятельность в пределах задач, установленных командованием ВС РО.\n\nРота охраны и сопровождения (РОС) - специализированное подразделение ВС РО, обеспечивающее охрану и сопровождение генералитета во время служебных выездов и официальных мероприятий, а также охранное сопровождение военных поставок и транспортных колонн по распоряжению уполномоченного командования. Куратор РОС входит в состав Управления специальных операций и разведки и осуществляет надзор за РОС. РОС не подменяет ОВО в караульно-постовой службе, ССО в организации поставок и Автомобильную роту в обеспечении техникой.\n\nОтдел «Росгвардия» (РГ) - специализированное подразделение ВС РО, предназначенное для охраны общественного порядка и обеспечения общественной безопасности при патрулировании улиц города. Оказывает содействие МВД и ФСБ, участвует в обеспечении безопасности согласованных мероприятий, выявляет и передаёт правонарушителей уполномоченным правоохранительным органам. Предельная численность подразделения - 30 военнослужащих, включая командира и его заместителя.\n\n2.5. Воинские звания:\n19 - Генерал армии\n18 - Генерал-полковник\n17 - Генерал-лейтенант\n16 - Генерал-майор\n15 - Полковник\n14 - Подполковник\n13 - Майор\n12 - Капитан\n11 - Старший лейтенант\n10 - Лейтенант\n9 - Младший лейтенант\n8 - Старший прапорщик\n7 - Прапорщик\n6 - Старшина\n5 - Старший сержант\n4 - Сержант\n3 - Младший сержант\n2 - Ефрейтор\n1 - Рядовой\n\n2.6. Категории личного состава:\nГенералитет - Генерал армии, Генерал-полковник, Генерал-лейтенант, Генерал-майор.\nКомандный состав (комсостав) - определяется по должности, независимо от звания: начальники управлений и их заместители, Командир воинской части и его заместители, Комендант воинской части, указанный в пункте 13.1 УВС, Начальник УТЦ, Командир батальона, Командир автомобильной роты, Начальник медицинской службы, Куратор Роты охраны и сопровождения, Командир Роты охраны и сопровождения, Командир Росгвардии, а также их заместители.\nОфицерский состав - Полковник, Подполковник, Майор, Капитан, Старший лейтенант, Лейтенант, Младший лейтенант.\nПрапорщики - Старший прапорщик, Прапорщик.\nСержантский состав - Старшина, Старший сержант, Сержант, Младший сержант.\nРядовой состав - Ефрейтор, Рядовой.\n\n2.7. Принцип управления:\n- Приказы личному составу подразделения отдаёт непосредственный начальник по должности.\n- Командир одного подразделения не управляет личным составом другого подразделения, даже если старше по званию.\nИсключения:\n- НГШ и ЗНГШ - в отношении всех военнослужащих;\n- начальники управлений и их заместители - в отношении подразделений своего управления;\n- Куратор РОС - в отношении РОС в пределах полномочий, установленных пунктами 10.11 и 13.6 УВС, преимущественно через Командира РОС;\n- Военная полиция - только в пределах надзора и пресечения нарушений;\n- Медицинская служба - в рамках своей деятельности;\n- дежурный по воинской части - при чрезвычайном происшествии;\n- дежурный по КПП - в вопросах несения службы на посту.\n\n2.8. Иерархия обращений обратна иерархии управления: военнослужащий обращается к непосредственному командиру, далее - к вышестоящему.\nОбращение «через голову» допускается: при жалобе на непосредственного командира; при его отсутствии более 24 часов; в экстренных случаях."},{"t":"РАЗДЕЛ 3. СУБОРДИНАЦИЯ И ИСПОЛНЕНИЕ ПРИКАЗОВ","b":"3.1. Субординация - система служебных отношений, определяющая порядок подчинения младших старшим по званию и должности, основанная на уважении, воинской дисциплине и исполнении законных приказов.\n\n3.2. Воинская дисциплина - строгое соблюдение военнослужащими законодательства РО, Военной присяги, уставов и законных приказов командиров.\n\n3.3. Обращение к старшему по званию:\nОбращение: «Товарищ (звание) (фамилия), разрешите обратиться»;\nПример: «Товарищ Полковник Иванов, разрешите обратиться по вопросу отпуска»;\nСогласие: «Так точно»;\nНесогласие: «Никак нет»;\nПринятие приказа: «Есть»;\nНезнание ответа: «Не могу знать»;\nИзвинение: «Виноват, исправлюсь»;\nПриветствие: «Здравия желаю, товарищ (звание)!».\n\n3.4. Обращение к младшему по званию - по званию и фамилии.\nПример: «Сержант Тарасов, выйти из строя!»\nГенералитету и комсоставу допускается обращение к младшим на «ты». Оскорбление, унижение достоинства и неуставные отношения между военнослужащими запрещены.\n\n3.5. Общение с гражданскими лицами - вежливо, с обращением «Гражданин» / «Гражданка». Гражданским лицом считается каждый, кто не одет в форму государственной структуры. Нецензурная брань, оскорбления и применение силы без законных оснований запрещены.\n\n3.6. Исполнение приказа:\n1) Законный приказ подлежит исполнению точно и в срок.\n2) Приказ должен находиться в пределах полномочий лица, его отдающего, быть ясным и исполнимым.\n3) При невозможности исполнения приказа военнослужащий обязан незамедлительно доложить отдавшему приказ.\n4) Заведомо незаконный приказ исполнению не подлежит. Неисполнение заведомо незаконного приказа не является нарушением. Ответственность за вред от исполнения приказа несёт лицо, его отдавшее; исполнивший заведомо незаконный приказ несёт ответственность на общих основаниях.\n5) Несогласие с приказом не освобождает от его исполнения, если он законен. Приказ может быть обжалован вышестоящему командованию, руководству Военной полиции либо в Прокуратуру РО.\n\n3.7. Вышестоящий начальник вправе отдать приказ подчинённому «через голову» его командира, уведомив об этом непосредственного командира."},{"t":"РАЗДЕЛ 4. ПРАВА И ОБЯЗАННОСТИ ВОЕННОСЛУЖАЩИХ","b":"4.1. Военнослужащий обязан:\n4.1.1. Честно и добросовестно исполнять долг перед Россией Онлайн, защищать её граждан, государственное имущество и территорию.\n4.1.2. Соблюдать Конституцию, законодательство РО и уставы ВС РО; знать УВС, ДУ, УКПС и положение своего подразделения.\n4.1.3. Не препятствовать законной деятельности МВД, ГИБДД, ФСБ, ФСО, Следственного комитета и Прокуратуры РО.\n4.1.4. Соблюдать субординацию и нормы воинской этики.\n4.1.5. Знать в лицо генералитет ВС РО и командира своего подразделения.\n4.1.6. Не разглашать государственную тайну и служебную информацию ВС РО. Необоснованно засекречивать сведения запрещено.\n4.1.7. Находиться на территории воинской части в рабочее время, за исключением случаев, предусмотренных Разделом 5 УВС, служебных задач и приказа командования.\n4.1.8. В рабочее время носить форму своего подразделения и табельное снаряжение.\n4.1.9. Получать табельное оружие и снаряжение на складе ВС РО и отчитываться о его получении и сдаче, бережно относиться к оружию, имуществу и технике. Оружие, полученное в ходе перестрелок, является вещественным доказательством и сдаётся на склад ВС РО.\n4.1.10. Вести видеофиксацию происшествий, задержаний и применения силы во время службы и хранить её не менее 72 часов, а при поданной жалобе или начатой проверке - до её окончания.\n4.1.11. Иметь действующую медицинскую справку (срок действия - не более 30 дней с момента выдачи в соответствии со статьёй 2.2 Закона РО «О государственных документах»).\n4.1.12. Присутствовать на вечерней поверке и построениях.\n4.1.13. Еженедельно сдавать отчёт о проделанной работе.\n4.1.14. Незамедлительно сообщать командованию о ситуации, угрожающей жизни и здоровью людей или сохранности имущества ВС РО.\n\n4.2. Военнослужащий имеет право:\n4.2.1. На отдых - перерыв, увольнительное время, отгул, лечение и отпуск в порядке Раздела 5 УВС.\n4.2.2. На перекур в специально отведённом месте (курилка).\n4.2.3. На обжалование приказов, решений и дисциплинарных взысканий в порядке, установленном ДУ, а также в Прокуратуру РО.\n4.2.4. На юридическую защиту своих прав и законных интересов.\n4.2.5. На поощрения за добросовестную службу.\n4.2.6. На увольнение по собственному желанию и восстановление на службе в порядке Раздела 8 УВС.\n4.2.7. На фактическое задержание лиц и применение силы и оружия в порядке пунктов 4.3 и 4.4 УВС.\n\n4.3. Задержание:\n4.3.1. Право фактического задержания (наручники, кратковременное удержание до прибытия уполномоченных сотрудников и передача задержанного) имеют военнослужащие от звания «Сержант» при наличии законных оснований. Процессуальные действия при задержании (разъяснение прав, досмотр, проверка документов, внесение сведений, доставление в МВД, ГИБДД или ФСБ) в системе ВС РО проводит только Военная полиция. Исключение в части непосредственной передачи задержанного прибывшим сотрудникам МВД или ФСБ без проведения процессуальных действий предусмотрено пунктом 10.12.8 УВС для Росгвардии. Курсанты Академии и граждане, проходящие КМБ, самостоятельно задерживать лиц не вправе.\n4.3.2. Основания для задержания:\n- лицо застигнуто в момент или сразу после совершения преступления на территории воинской части или прилегающей к ней территории;\n- незаконное проникновение или нахождение на территории воинской части;\n- на лице, при нём или в его транспорте обнаружены явные следы преступления;\n- имеется фото- или видеофиксация совершённого лицом преступления;\n- лицо находится в активном розыске (задержание производит Военная полиция).\n4.3.3. Задержанный незамедлительно передаётся Военной полиции, которая проводит процедуру задержания и доставляет его в МВД, ГИБДД или ФСБ. При городском патрулировании сотрудники Росгвардии могут передать фактически задержанного непосредственно прибывшим сотрудникам МВД или ФСБ на месте происшествия в порядке пункта 10.12.8 УВС.\n4.3.4. Военнослужащие ВС РО, включая Военную полицию, не вправе привлекать к уголовной или административной ответственности, выписывать штрафы, производить арест, проводить допрос задержанного и удерживать его сверх установленного срока.\n4.3.5. В рамках дисциплинарного разбирательства наручники и удержание к военнослужащему не применяются. Задержание военнослужащего допускается только по основаниям пункта 4.3.2 и в порядке, установленном законом.\n4.3.6. Государственный служащий, задерживаемый исключительно для проверки законности нахождения на территории воинской части, личному обыску не подвергается.\n4.3.7. Лица, обладающие статусом неприкосновенности (в том числе НГШ и ЗНГШ), досмотру и обыску не подвергаются, их транспорт не досматривается и не подвергается процедуре остановки; порядок их допуска на территорию воинской части определяется УКПС. Задержание таких лиц допускается только в случаях, прямо предусмотренных законом о статусе неприкосновенности. Если задерживаемый заявляет о неприкосновенности, ему предоставляется возможность подтвердить статус служебным удостоверением или идентификационным знаком.\n\n4.4. Применение силы и оружия:\n4.4.1. Сила и оружие применяются только при необходимости и соразмерно угрозе, по стадиям:\n1) присутствие военнослужащего;\n2) устное требование (с предупреждением о применении силы, если обстановка позволяет);\n3) физическая сила и резиновая дубинка;\n4) специальные средства и нелетальное оружие (электрошокер, резиновые пули и т.п.);\n5) огнестрельное оружие.\n4.4.2. Применению оружия предшествует чётко выраженное предупреждение, кроме случаев, когда промедление создаёт непосредственную опасность для жизни людей или может повлечь иные тяжкие последствия. Предупредительный выстрел не обязателен. При непосредственной угрозе жизни и здоровью, вооружённом нападении или попытке побега допускается незамедлительный переход к необходимой стадии.\n4.4.3. Огнестрельное оружие применяется:\n- для защиты жизни и здоровья граждан, военнослужащих и должностных лиц от нападения;\n- для отражения нападения на воинскую часть - с момента нападения и до полного устранения угрозы;\n- при незаконном проникновении на территорию воинской части, если лицо после предупреждения не выполняет требование остановиться и подчиниться, оказывает сопротивление или пытается скрыться;\n- при прорыве на транспортном средстве через КПП или на территорию воинской части (в первую очередь - огонь по колёсам и двигателю);\n- для пресечения попытки завладеть оружием, боеприпасами, техникой и имуществом ВС РО;\n- если лицо с открыто носимым холодным оружием приближается к военнослужащему и игнорирует требование спрятать оружие, отойти или держать дистанцию и такое сближение создает непосредственную угрозу жизни или здоровью военнослужащего либо иных лиц;\n- для освобождения заложников и пресечения террористических посягательств;\n- против воздушного судна в закрытом воздушном пространстве части, если лица, управляющие им, игнорируют радиосвязь, запросы на идентификацию и предупреждения, в порядке, установленном законодательством РО ;\n- в период чрезвычайного и военного положения - в порядке Раздела 12 УВС;\n- в иных случаях, прямо предусмотренных законодательством.\n4.4.4. О каждом применении оружия и специальных средств военнослужащий докладывает дежурному по части и Военной полиции и сохраняет видеозапись.\n4.4.5. При применении оружия военнослужащий обязан не допускать причинения вреда третьим лицам.\n\n4.5. Ношение оружия:\n4.5.1. При исполнении военнослужащий носит оружие на спине, на боку, на ремне или в кобуре. Лицензия на оружие военнослужащему не требуется.\n4.5.2. Открыто в руках оружие носится: при патрулировании; при обеспечении режима чрезвычайного или военного положения; при подготовке к применению оружия, если есть основания полагать о наличии угрозы; при конвоировании задержанного; при сопровождении первых лиц государства совместно с ФСО.\n4.5.3. Вне службы (перерыв, увольнительное, окончание рабочего дня) служебное оружие и специальные средства носятся только скрыто.\n4.5.4. Военнослужащим запрещено продавать, дарить и передавать любое оружие гражданским лицам."},{"t":"РАЗДЕЛ 5. СЛУЖЕБНОЕ ВРЕМЯ И ОТДЫХ","b":"5.1. Для военнослужащих рабочими являются все дни недели, включая воскресенье:\n- понедельник - воскресенье: с 10:00 до 01:00;\n- государственные праздничные дни: с 11:00 до 22:00.\nРабочее время составляет не менее 10 часов в сутки без учёта перерыва и увольнительного.\n\n5.2. НГШ вправе приказом временно изменить служебный график с соблюдением пункта 5.1.\n\n5.3. Перерыв (обед) предоставляется один раз в день - не менее 60 минут и не более 2 часов, в праздничные дни - 60 минут. Время перерыва определяет командир подразделения, для постовых - дежурный по части; постовой уходит на перерыв только после замены на посту. О начале и окончании перерыва военнослужащий докладывает в рацию с указанием времени - этот доклад является отметкой о перерыве. Повторный перерыв в тот же день не предоставляется. Перерыв не может приходиться на время вечерней поверки.\n\n5.4. Увольнительное время:\n- военнослужащие от звания «Сержант» вправе получить увольнительное один раз в сутки продолжительностью до 60 минут с разрешения непосредственного командира или дежурного по части; о получении увольнительного сообщается в рацию;\n- увольнительное не предоставляется на время вечерней поверки и в государственные праздничные дни;\n- курсанты Академии и граждане, проходящие КМБ, в рабочее время покидают воинскую часть только по приказу или с разрешения инструктора УТЦ;\n- генералитет и комсостав имеют ненормированный служебный день и вправе покидать воинскую часть по служебным и личным делам с уведомлением вышестоящего начальника. При этом руководство ВС РО оставляет за собой право устанавливать регламент служебного времени для генералитета и комсостава, а также вводить дополнительные ограничения на временное убытие из расположения воинской части. Командиры подразделений и их заместители обязаны заранее уведомлять вышестоящего начальника в установленном канале связи по соответствующей форме о каждом намерении покинуть расположение воинской части по личным делам.\n\n5.5. Отпуск - до 7 суток в месяц. Предоставляется по рапорту, согласованному с командиром подразделения. Командир вправе один раз перенести начало отпуска по служебной необходимости не более чем на 3 суток, но не вправе лишить военнослужащего права на отпуск.\n\n5.6. Отгул - до 1 суток, не чаще одного раза в неделю, по рапорту с разрешения командира подразделения.\n\n5.7. Лечение - при наличии листа нетрудоспособности, выданного Медицинской ротой или медицинским учреждением РО, военнослужащий освобождается от службы на срок, указанный в листе.\n\n5.8. Отзыв из отпуска, отгула, увольнительного, перерыва, а также вызов на службу во внеслужебное время допускается только:\n- при чрезвычайной ситуации или чрезвычайном происшествии (нападение на воинскую часть, боевая тревога, военное или чрезвычайное положение);\n- по письменному распоряжению Министерства обороны РО.\n\n5.9. Нахождение в курилке и казармах в рабочее время допускается не более 15 минут подряд и не является бездействием."},{"t":"РАЗДЕЛ 6. ФОРМА ОДЕЖДЫ, СНАРЯЖЕНИЕ И ТЕХНИКА","b":"6.1. В рабочее время военнослужащий носит форму своего подразделения с погонами своего звания.\nИсключения: специальные операции, тренировки, приказ командования. Генералитет носит форму по своему усмотрению.\n\n6.2. Внешний вид: мужчины - стрижка не длиннее 3 мм; женщины - аккуратная собранная причёска. Новобранец приводит внешний вид в порядок при заключении контракта.\n\n6.3. Ношение масок:\n- разрешено только военнослужащим ССО, ООСпН, ОВО, ВП при наличии открыто носимого знака подразделения;\n- на общих построениях маски разрешены только ССО, ООСпН;\n- военнослужащий обязан снять маску по требованию непосредственного руководителя, сотрудника Прокуратуры РО, а также при служебной проверке;\n- ношение маски запрещено при общении с Премьер-министром, Вице-премьер-министром и Министром обороны РО.\n\n6.4. Табельное снаряжение (бронежилет, оружие, боекомплект, медикаменты, рация) получается на складе ВС РО и сдаётся обратно в исправном состоянии. Получение и сдача оружия фиксируются в журнале учёта склада.\n\n6.5. Военнослужащий пользуется техникой, закреплённой за его подразделением. Иная техника выдаётся по запросу через Автомобильную роту.\n6.6. Скорость движения по территории воинской части - не более 60 км/ч, за исключением колонн поставок и тревоги.\n6.7. Передвижение на личном транспорте по территории воинской части запрещено. Исключение - генералитет."},{"t":"РАЗДЕЛ 7. ПОСТРОЕНИЯ И ВЕЧЕРНЯЯ ПОВЕРКА","b":"7.1. Построение - организованный сбор личного состава на плацу для проверки присутствия, доведения приказов, подведения итогов, награждений, назначений и инструктажей.\n\n7.2. Объявлять построение вправе:\n- общее построение ВС РО - НГШ и ЗНГШ;\n- построение управления - начальник управления и его заместитель;\n- построение подразделения - командир подразделения и его заместитель;\n- экстренное построение - дежурный по воинской части при чрезвычайном происшествии.\n\n7.3. Время на прибытие назначает лицо, объявившее построение.\nПример общего построения: «Внимание всему личному составу! Общее построение на плацу. Время на прибытие - 10 минут. Форма одежды - повседневная, оружие убрать. Командирам подразделений обеспечить сбор личного состава».\nПример построения подразделения: «Военная полиция, построение в расположении ВП. Время на прибытие - 5 минут».\nПример экстренного построения: «Внимание всему личному составу! Экстренное построение на плацу. Прибыть незамедлительно в боевой форме. Командирам подразделений доложить о готовности».\n\n7.4. Вечерняя поверка проводится ежедневно в 21:30 на плацу. Присутствовать обязан весь личный состав, находящийся на службе.\nНа время поверки:\n- на КПП-1 и КПП-2 остаётся по одному военнослужащему ОВО по назначению дежурного по части, их присутствие подтверждается докладом по рации;\n- КПП-3 и КПП-4 закрываются и перекрываются техникой;\n- постовые вышки оставляются, наблюдение ведут постовые КПП-1 и КПП-2.\n\n7.5. Порядок доклада:\n7.5.1. После построения командиры подразделений поочерёдно, в порядке, установленном проводящим поверку, выходят из строя, подходят к принимающему доклад и обращаются по званию.\n7.5.2. Форма доклада:\n«Товарищ (звание)! Личный состав (подразделение) для вечерней поверки построен в количестве (число) военнослужащих. За сегодняшний день подразделением проведены (патрули, тренировки, поставки, проверки постов, экзамены и т.д.). Доклад окончен. (Должность), (звание, фамилия)».\n7.5.3. Командиры других подразделений не перебивают докладывающего без разрешения принимающего доклад.\n\n7.6. В строю запрещено разговаривать, пользоваться телефоном, самовольно покидать строй и совершать посторонние действия."},{"t":"РАЗДЕЛ 8. ПРОХОЖДЕНИЕ СЛУЖБЫ","b":"8.1. Поступление на службу:\n8.1.1. Контракт может быть заключён с гражданином РО от 18 лет, имеющим действующую медицинскую справку о годности, не имеющим судимости, не находящимся в розыске и не внесённым в чёрный список ВС РО.\n8.1.2. Контракт заключают инструкторы УТЦ и генералитет. В заключении контракта может быть отказано по основаниям пункта 8.1.1.\n8.1.3. Личный досмотр при поступлении на службу и при увольнении не проводится. При наличии самостоятельных законных оснований для обыска или досмотра соответствующие процессуальные действия осуществляются уполномоченными должностными лицами в порядке, установленном Уголовно-процессуальным кодексом РО.\n\n8.2. Академия:\n8.2.1. После заключения контракта военнослужащий зачисляется в Академию курсантом в звании «Рядовой».\n8.2.2. Первый этап Академии - Курс молодого бойца (КМБ). По сдаче экзамена КМБ курсанту присваивается звание «Ефрейтор», и он принимает Военную присягу.\n8.2.3. Дальнейшие повышения курсантов производит УТЦ по отчётам и экзаменам.\n8.2.4. По получении звания «Младший сержант» военнослужащий завершает Академию и распределяется в подразделение ОВО.\n\n8.3. Текст Военной присяги:\n«Я, (фамилия, имя), торжественно присягаю на верность своему Отечеству - РО. Клянусь свято соблюдать Конституцию РО, строго выполнять требования воинских уставов, приказы командиров и начальников. Клянусь достойно исполнять воинский долг, мужественно защищать свободу, независимость и конституционный строй РО, народ и Отечество».\n\n8.4. Военный билет:\n8.4.1. Военный билет - государственный документ, выдаётся уполномоченным военнослужащим УТЦ:\n- по достижению звания «Прапорщик»;\n- по завершении КМБ - гражданам, проходящим КМБ с целью получения военного билета без заключения контракта.\n8.4.2. Граждане, проходящие КМБ для получения военного билета, на время курса приравниваются к курсантам Академии и принимают присягу по его завершении.\n8.4.3. Выдача военных билетов производится УТЦ ежедневно в 22:00, после вечерней поверки и повышений. Генералитет вправе изменять время выдачи по уважительной причине.\n8.4.4. Продажа военных билетов и ускоренное прохождение КМБ за вознаграждение запрещены.\n\n8.5. Повышение в звании и должности:\n8.5.1. Повышение производится строго по системе повышения подразделения.\n8.5.2. Для повышения военнослужащий не должен иметь активных дисциплинарных взысканий (предупреждение повышению не препятствует).\n8.5.3. Повышение производится по представлению командира подразделения (его заместителя) и согласуется с куратором направления.\n8.5.4. Повышения проводятся после вечерней поверки. В иное время - по согласованию с куратором направления или руководством ВС РО.\n8.5.5. Запрещено обходить систему повышения, использовать в отчётах свои или чужие ранее использованные материалы и подделывать материалы отчётов.\n\n8.6. Испытательный срок:\n8.6.1. Военнослужащие, назначенные на должности комсостава и в генералитет, проходят испытательный срок от 14 до 21 дня с момента назначения.\n8.6.2. Продолжительность испытательного срока устанавливает и его итог оценивает лицо, назначившее на должность.\n8.6.3. Не прошедший испытательный срок возвращается на прежнюю должность и звание.\n\n8.7. Перевод между подразделениями:\n8.7.1. Перевод возможен от звания «Ст.Сержант».Распределение выпускника Академии в ОВО по п. 8.2.4 УВС переводом не считается.\nПримечание; Перевод возможен от звания \"Рядовой\" при одобрении НГШ или ЗНГШ\n8.7.2. Перевод не производится при наличии активного выговора, а также если в отношении военнослужащего ведётся расследование Прокуратуры или Следственного комитета РО.\n\n8.8. Увольнение по собственному желанию:\n8.8.1. Военнослужащий вправе подать рапорт об увольнении в любое время. Командование не вправе отказать в увольнении и обязано уволить военнослужащего не позднее 48 часов с момента подачи рапорта.\n8.8.2. Если курсант увольняется, не завершив Академию, либо военнослужащий увольняется, не завершив поставленную задачу, командование вправе внести его в чёрный список ВС РО с лишением присвоенного звания.\n8.8.3. Рапорт об увольнении не исполняется, если в отношении военнослужащего возбуждено уголовное или административное дело либо ведётся расследование Прокуратуры или Следственного комитета РО.\n8.8.4. При увольнении военнослужащий сдаёт табельное оружие, снаряжение и служебное имущество.\n\n8.9. Увольнение по инициативе командования производится при:\n- существенном или неоднократном нарушении уставов ВС РО;\n- существенном или неоднократном нарушении законодательства РО;\n- ненадлежащем исполнении служебных обязанностей;\n- прогуле рабочего дня;\n- явке на службу в состоянии алкогольного или наркотического опьянения;\n- разжигании конфликтов внутри ВС РО или между государственными структурами;\n- отсутствии на службе 7 рабочих дней и более без уважительной причины и без уведомления командования;\n- постановлении надзорного органа.\n\n8.10. Если сотрудник Прокуратуры РО подтвердил совершение военнослужащим преступления и назначение ему наказания в виде лишения свободы, командование обязано уволить такого военнослужащего. Пункт 8.8.3 на этот случай не распространяется.\n\n8.11. Военнослужащий вправе восстановиться на службе в прежней должности в течение 30 дней со дня увольнения. Восстановление не допускается при внесении в чёрный список ВС РО, а также при увольнении по решению суда, в связи с судимостью, расследованием Прокуратуры или ордером, за исключением помилования, замены или отсрочки наказания."},{"t":"РАЗДЕЛ 9. ОТЧЁТНОСТЬ","b":"9.1. Все отчёты, рапорты и заявления составляются строго по установленной форме.\nРапорт как служебное дело оформляется с указанием герба и названия ВС РО, номера, даты, должности, имени, фамилии и подписи составившего, печати подразделения.\n\n9.2. Запрещено удалять отчёты и редактировать заявления после отправки, в том числе изменять сроки отпуска после одобрения.\nИсключение: военнослужащий, самостоятельно заметивший ошибку до рассмотрения отчёта, вправе удалить его и подать заново.\n\n9.3. Каждый военнослужащий еженедельно сдаёт отчёт о проделанной работе вне зависимости от её объёма. Норма устанавливается командиром подразделения и утверждается куратором направления.\n\n9.4. Комсостав еженедельно подаёт отчёт о работе подразделения куратору направления.\n\n9.5. Выполнивший норму и сдавший отчёт получает премию и дополнительную премию; сдавший отчёт без выполнения нормы - премию. Размер премии зависит от звания, должности и выслуги.\n\n9.6. Материалы, подтверждающие нарушение и послужившие основанием для взыскания или кадрового решения, хранятся не менее 72 часов."},{"t":"РАЗДЕЛ 10. ПОЛНОМОЧИЯ ПОДРАЗДЕЛЕНИЙ","b":"10.1. Военная полиция:\n10.1.1. Осуществляет надзор за соблюдением уставов всеми военнослужащими ВС РО, кроме генералитета. Полномочия по надзору и применению взысканий предоставлены Военной полиции Начальником Генерального штаба настоящим Уставом.\n10.1.2. Действует: на территории воинской части и прилегающей к ней территории; на КПП; в местах учений, операций и поставок; в отношении военной техники, имущества и вооружения; в отношении военнослужащих при исполнении; за пределами воинской части - если военнослужащий совершает нарушение, находится в розыске или порочит своими действиями ВС РО.\n10.1.3. Проводит служебные проверки, применяет дисциплинарные взыскания, назначает и принимает переаттестации, ведёт журнал взысканий.\n10.1.4. Патрулирует территорию РО с целью розыска дезертиров и задержания преступников с последующей передачей в правоохранительные органы.\n10.1.5. Проводит фактическое задержание в следующем порядке:\n1) надеть наручники;\n2) представиться;\n3) сообщить причину задержания;\n4) разъяснить права;\n5) провести первичный досмотр и изъять оружие (кроме случая пункта 4.3.7);\n6) проверить документы и установить, является ли задержанный государственным служащим;\n7) снять предметы, скрывающие лицо;\n8) внести сведения о задержании в государственную информационную систему;\n9) доставить задержанного в МВД, ГИБДД или ФСБ - в срок не более 30 минут с момента задержания, задержанный, не переданный уполномоченному сотруднику в указанный срок, подлежит освобождению.\nФормулировка разъяснения прав: «В соответствии со статьёй 47 Конституции РО, вы вправе не свидетельствовать против себя самого и своих близких. Вы имеете право на квалифицированную юридическую помощь адвоката и один телефонный звонок. Вам ясны ваши права?»\nЕсли задержанный является государственным служащим, ВП уведомляет об этом его руководство и сообщает принимающему сотруднику МВД или ФСБ для вызова Прокуратуры и Следственного комитета в порядке, установленном законом.\n10.1.6. Ограничения полномочий ВП:\n- не подменяет МВД, ФСБ и иные правоохранительные органы;\n- не привлекает к уголовной и административной ответственности, не выписывает штрафы, не производит арест и допрос;\n- не вмешивается в управление подразделениями, если действия командования законны;\n- не отменяет приказы командования; при явно незаконном приказе ВП требует приостановить его исполнение и незамедлительно докладывает НГШ или ЗНГШ, которые принимают решение;\n- не применяет взыскания, не предусмотренные ДУ;\n- не исполняет ордера и не задерживает лиц, обладающих статусом неприкосновенности, кроме случаев, предусмотренных законом.\n10.1.7. О нарушениях генералитета ВП составляет материалы и передаёт их НГШ, а о нарушениях НГШ - Министру обороны РО и в Прокуратуру РО.\n\n10.2. Отдел вневедомственной охраны:\n10.2.1. Несёт караульно-постовую службу в порядке УКПС.\n10.2.2. Назначает из своего офицерского состава дежурного по воинской части.\n10.2.3. Проверяет документы и цель визита на КПП, контролирует въезд и выезд.\n10.2.4. Фиксирует подозрения на незаконный выезд военнослужащих (в том числе курсантов) и передаёт материалы ВП.\n\n10.3. Силы специальных операций:\n10.3.1. Организуют и проводят поставки материалов, оружия и снаряжения, руководят колоннами.\n10.3.2. Выполняют специальные задачи по приказу руководства ВС РО и начальника Управления специальных операций и разведки.\n10.3.3. При необходимости привлекают РОС для охранного сопровождения поставок. Общее руководство организацией поставки и колонной сохраняется за назначенным представителем ССО либо иным руководителем, определённым командованием ВС РО.\n\n10.4. Мотострелковый батальон:\n10.4.1. Осуществляет боевое охранение колонн и поставок совместно с ССО.\n10.4.2. При нападении на воинскую часть поступает в распоряжение дежурного по части как резерв усиления.\n10.4.3. Проводит оцепление местности по приказу командования при чрезвычайной ситуации, военном или чрезвычайном положении, а также по приказу Премьер-министра РО.\n\n10.5. Медицинская рота:\n10.5.1. Еженедельно проверяет наличие действующих медицинских справок у личного состава.\n10.5.2. О военнослужащем с просроченной справкой МР докладывает его командиру, который незамедлительно представляет материалы НГШ или ЗНГШ. НГШ или ЗНГШ вправе отстранить военнослужащего от службы до продления справки, но не более чем на 7 суток. На время отстранения военнослужащий не исполняет служебные обязанности. Если справка не продлена в течение 7 суток, материалы передаются в Прокуратуру РО для решения вопроса о дальнейшем отстранении;\n10.5.3. Выезжает на боевые задачи, поставки и учения для оказания медицинской помощи.\n10.5.4. Проводит занятия по тактической медицине и первой помощи для других подразделений.\n\n10.6. Автомобильная рота:\n10.6.1. Ведёт учёт техники, выдаёт и принимает её, следит за исправностью.\n10.6.2. Выстраивает технику для поставок, дропов и мероприятий по запросу ССО, РОС и командования. Выдача транспорта РОС осуществляется в установленном порядке.\n10.6.3. Фиксирует использование техники не по назначению и передаёт материалы ВП.\n\n10.7. Учебно-тренировочный центр:\n10.7.1. Обучает курсантов и проводит КМБ.\n10.7.2. Заключает контракты и выдаёт военные билеты.\n10.7.3. Применяет к курсантам взыскания в порядке ДУ, принимает переаттестации курсантов.\n\n10.8. Отдельный отряд специального назначения (ООСпН):\n10.8.1. Обеспечивает разведку на специальных операциях.\n10.8.2. Проводит тренировки состава по боевой подготовке.\n\n10.9. Тренировки и учения для всей воинской части проводят УТЦ, ССО и МСБ - каждое подразделение не чаще 2 раз в неделю. Общий график утверждает Командир воинской части по согласованию с начальником Управления специальных операций и разведки. Занятия УТЦ с курсантами не ограничиваются.\n\n10.10. Командиры подразделений самостоятельны в управлении своими подразделениями и не вмешиваются в работу других подразделений, за исключением случаев, указанных в пункте 2.7 УВС.\n\n10.11. Рота охраны и сопровождения (РОС):\n10.11.1. РОС является специализированным подразделением ВС РО, входящим в состав Управления специальных операций и разведки. Куратор РОС входит в состав Управления специальных операций и разведки и осуществляет надзор за РОС, непосредственно подчиняясь начальнику управления. Повседневное руководство личным составом РОС осуществляют Командир РОС и его заместитель.\n10.11.2. По поручению генералитета, согласованному с командованием РОС, либо по распоряжению вышестоящего командования организует сопровождение генералов ВС РО при служебных выездах, посещении государственных органов, официальных встречах и иных служебных мероприятиях.\n10.11.3. Обеспечивает порядок и охранное сопровождение командования при проведении военных совещаний, церемоний и межведомственных встреч. В пределах воинской части координирует свои действия с ОВО и дежурным по части, не принимая на себя функции пропускного режима без отдельного законного распоряжения.\n10.11.4. По заявке ССО либо по приказу командования выделяет личный состав для охраны военных поставок, сопровождает транспортные колонны и обеспечивает связь между выделенными сотрудниками. Планирование поставки, определение её назначения и общее управление колонной осуществляют ССО либо назначенный командованием руководитель операции.\n10.11.5. По согласованию с Автомобильной ротой получает транспорт для сопровождения и отвечает за его использование по служебному назначению. Учёт, выдача и приём техники остаются в ведении Автомобильной роты.\n10.11.6. По распоряжению командования может осуществлять сопровождение официальных делегаций, обеспечивать безопасную доставку должностных лиц и участвовать в согласованных учениях по эвакуации охраняемых лиц.\n10.11.7. В рамках выполнения задач взаимодействует с ССО, МСБ, ОВО, Автомобильной и Медицинской ротами. При сопровождении первых лиц государства и лиц, находящихся под государственной охраной, действует только в пределах предоставленных полномочий и при необходимом согласовании с ФСО.\n10.11.8. Командир РОС под контролем Куратора РОС назначает старших групп, распределяет личный состав, проводит инструктажи и контролирует исполнение поручений. Заместитель командира РОС оказывает ему содействие и исполняет его обязанности при отсутствии командира в пределах предоставленных полномочий.\n10.11.9. Старший группы сопровождения организует работу подчинённых ему сотрудников РОС, контролирует радиосвязь и докладывает о начале, ходе и завершении поставленной задачи. Руководство военнослужащими иных подразделений допускается только в случаях, прямо предусмотренных пунктом 2.7 УВС, либо в пределах надлежащим образом назначенного общего руководства операцией.\n10.11.10. Сотрудники РОС проходят подготовку по служебному сопровождению, передвижению в колонне, радиосвязи, порядку обеспечения безопасности командования и действиям при чрезвычайных ситуациях. Тренировки собственного личного состава проводятся в порядке, установленном командиром РОС; проведение общевойсковых учений осуществляется в соответствии с пунктом 10.9 УВС.\n10.11.11. При возникновении угрозы охраняемому лицу или колонне сотрудники РОС незамедлительно сообщают об этом по служебной связи и принимают соразмерные меры защиты, руководствуясь пунктами 4.3-4.4 УВС и законодательством РО. Задержание, применение силы и оружия допускаются только на общих законных основаниях; самостоятельное проведение процессуальных действий сотрудниками РОС запрещено.\n10.11.12. Выполнение задач сопровождения за пределами воинской части не является самостоятельным патрулированием. РОС не наделяется дополнительными полномочиями по досмотру граждан и транспорта, ограничению движения, задержанию либо охране общественного порядка сверх полномочий, предусмотренных законодательством и уставами ВС РО.\n10.11.13. Личному составу РОС запрещается самовольно организовывать сопровождения, использовать служебный транспорт в личных целях, разглашать охраняемые сведения о маршрутах, времени и составе поставок и служебных поездок. За нарушения военнослужащие несут ответственность в общем порядке.\n10.11.14. По завершении поручения старший группы составляет служебный доклад, а личный состав представляет необходимые отчётные материалы в порядке Раздела 9 УВС.\n10.11.15. Куратор РОС осуществляет надзор за организацией службы в подразделении, контролирует выполнение приказов вышестоящего командования, оценивает эффективность охранных мероприятий и проводит служебные совещания с Командиром РОС.\n10.11.16. Куратор РОС вправе запрашивать у Командира РОС отчёты и сведения о деятельности подразделения, давать поручения по организации службы в пределах полномочий, согласовывать планы сопровождения и направлять начальнику управления предложения по совершенствованию работы и кадровым решениям.\n10.11.17. Куратор РОС не осуществляет самостоятельное управление ССО, ГРУ, ООСпН, ОВО, Автомобильной ротой и другими подразделениями. Вмешательство в непосредственное управление отдельными группами РОС допускается при отсутствии командования роты, наличии экстренной угрозы или по прямому поручению вышестоящего командования.\n10.11.18. Командир РОС представляет Куратору РОС отчётность о деятельности роты для последующего доклада Начальнику Управления специальных операций и разведки. Назначение Куратора РОС не отменяет действующий порядок согласования повышений и отчётности, установленный пунктами 8.5 и 9.3-9.4 УВС.\n\n10.12. Отдел «Росгвардия» (ГГ):\n10.12.1. Росгвардия является специализированным подразделением ВС РО. Подразделение возглавляет Командир Росгвардии; его заместитель организует повседневную службу и замещает командира при его отсутствии.\n10.12.2. Максимальная штатная численность Росгвардии составляет 30 (тридцать) военнослужащих, включая Командира Росгвардии, его заместителя и весь остальной личный состав. Назначать военнослужащих сверх указанного лимита запрещается.\n10.12.3. Росгвардия имеет право патрулировать улицы города с целью охраны общественного порядка и обеспечения общественной безопасности. Для Росгвардии это специальное исключение из общего порядка внешнего патрулирования армейских подразделений. Данное положение не предоставляет права на произвольные досмотры, задержания или иные принудительные действия.\n10.12.4. Городской патруль формируется по распоряжению Командира Росгвардии, его заместителя либо уполномоченного вышестоящего начальника. Патрулирование осуществляется военнослужащими от звания «Сержант» в составе не менее двух человек, с назначением старшего патруля и докладом о начале и завершении службы по рации.\n10.12.5. Во время патрулирования личный состав обязан наблюдать за общественной обстановкой, предупреждать нарушения в пределах предоставленных полномочий, содействовать защите граждан и имущества, а также незамедлительно докладывать о выявленных угрозах и происшествиях.\n10.12.6. Росгвардия вправе участвовать в обеспечении безопасности согласованных массовых и государственных мероприятий, оказывать содействие МВД и ФСБ по запросу и участвовать в мероприятиях по поддержанию общественного порядка. Порядок совместных действий определяется согласованием с соответствующим ведомством.\n10.12.7. При выявлении предполагаемого правонарушения сотрудник Росгвардии обязан сообщить обстоятельства и местонахождение в МВД или ФСБ и, при необходимости, запросить помощь. Применение силы, специальных средств и оружия допускается только при наличии законных оснований.\n10.12.8. Выявленные нарушители подлежат передаче сотрудникам МВД или ФСБ.\n10.12.9. Росгвардия не подменяет МВД и ФСБ в расследовании преступлений, Военную полицию в контроле воинской дисциплины, а ОВО в несении караульно-постовой службы и обеспечении пропускного режима воинской части. Патрулирование городских улиц не предоставляет командованию Росгвардии права отдавать приказы сотрудникам иных подразделений.\n10.12.10. Командир Росгвардии утверждает состав патрулей, назначает старших групп, организует внутреннее обучение, контролирует исполнение задач и отчётность. Заместитель Командира Росгвардии исполняет его обязанности при отсутствии командира в пределах предоставленных полномочий.\n10.12.11. Личный состав Росгвардии обязан соблюдать воинскую дисциплину, правила служебной радиосвязи и нормы общения с гражданами, использовать служебную технику только по назначению и фиксировать происшествия в установленном порядке. Видеозаписи происшествий и фактических задержаний хранятся в сроки, установленные пунктом 4.1.10 УВС.\n10.12.12. По завершении патруля старший группы представляет доклад о маршруте, времени службы, выявленных происшествиях и случаях передачи лиц сотрудникам МВД или ФСБ. Еженедельная отчётность военнослужащих и командира ведётся по Разделу 9 УВС.\n10.12.13. Сотрудникам Росгвардии запрещается использовать патрулирование для личных целей, самовольно вмешиваться в работу МВД или ФСБ, незаконно ограничивать права граждан, требовать вознаграждения либо разглашать служебную информацию. За нарушения применяется ответственность в порядке законодательства РО и действующих уставов ВС РО."},{"t":"РАЗДЕЛ 11. ПООЩРЕНИЯ","b":"11.1. За добросовестную службу, инициативу и успешное выполнение задач применяются поощрения:\n- премии и надбавки;\n- объявление благодарности;\n- внеочередной отпуск - вне графика, в пределах 7 суток отпуска в месяц;\n- представление к награде.\n\n11.2. Поощрения применяют командиры подразделений (в отношении своего личного состава), начальники управлений (в отношении подразделений своего управления) и руководство ВС РО. Государственные награды присваиваются Премьер-министром РО по представлению НГШ."},{"t":"РАЗДЕЛ 12. ЧРЕЗВЫЧАЙНОЕ И ВОЕННОЕ ПОЛОЖЕНИЕ","b":"12.1. Чрезвычайное положение вводится указом Премьер-министра, Вице-премьер-министра РО или Министра внутренних дел. Военное положение вводится указом Премьер-министра РО. Срок действия - не более 12 часов с момента публикации указа.\n\n12.2. В период чрезвычайного и военного положения координация деятельности и оперативное руководство Вооружёнными Силами РО осуществляются органами ФСБ РО в пределах, установленных конституционным законодательством РО. Специальные операции согласуются с НГШ, Директором ФСБ или Министром внутренних дел.\n\n12.3. С 23:00 до 06:00 действует комендантский час: гражданским лицам запрещено находиться на улице с оружием или без документов.\n\n12.4. В период чрезвычайного и военного положения военнослужащие вправе:\n- проводить оцепление местности, ограничивать движение транспорта и пешеходов;\n- проверять документы, производить обыск граждан и транспортных средств в порядке, установленном Уголовно-процессуальным кодексом РО, с учётом особенностей, предусмотренных конституционным законодательством РО о чрезвычайном и военном положении;\n- задерживать нарушителей комендантского часа до его окончания, а лиц без документов - до установления личности, с доставлением в правоохранительные органы;\n- применять огнестрельное оружие после предупреждения.\n\n12.5. В период военного положения ВС РО патрулируют территорию его действия, задерживают лиц, подозреваемых в преступлениях против государства, и подавляют организованное сопротивление всеми необходимыми средствами.\n\n12.6. В период военного положения местом пребывания членов Правительства РО является Форт. ВС РО обеспечивают их размещение и охрану совместно с ФСО.\n\n12.7. При передвижении высшего руководства государства в период чрезвычайного и военного положения ВС РО по приказу обеспечивают сопровождение.\n12.7.1. При привлечении РОС к сопровождению высшего руководства государства взаимодействие с ФСО и иными уполномоченными структурами организуется командованием ВС РО с соблюдением установленного порядка; РОС не заменяет полномочия ФСО.\n\n12.8. Задержанные за нарушение режима чрезвычайного и военного положения передаются в правоохранительные органы для привлечения к уголовной ответственности."},{"t":"РАЗДЕЛ 13. КОМЕНДАНТ ВОЕННОЙ ЧАСТИ И НАЧАЛЬНИКИ УПРАВЛЕНИЙ","b":"13.1. В Вооружённых Силах России Онлайн учреждаются должность коменданта военной части, а также должности начальников следующих управлений:\n\nа) Управление военной полиции и дисциплины;\n\nб) Управление военного образования и подготовки;\n\nв) Управление специальных операций и разведки;\n\nг) Управление координации и взаимодействия.\n\n13.2. Комендант военной части является должностным лицом, осуществляющим общее организационное руководство управлениями, координацию их деятельности и контроль за исполнением возложенных на них обязанностей. Должность заместителя коменданта военной части не предусматривается.\n\n13.3. К основным полномочиям коменданта военной части относятся:\n\nа) Координация деятельности начальников управлений и обеспечение их взаимодействия между собой;\n\nб) Контроль соблюдения воинской дисциплины, внутреннего распорядка и установленных правил несения службы;\n\nв) Организация проверок деятельности управлений, оценка эффективности исполнения поставленных задач;\n\nг) Проведение служебных совещаний с начальниками управлений, рассмотрение поступающих от них докладов и предложений;\n\nд) Выявление недостатков в организации службы и принятие мер по их устранению в пределах предоставленных полномочий;\n\nе) Разрешение организационных разногласий между управлениями и обеспечение согласованности их деятельности;\n\nж) Представление начальнику Генерального штаба докладов о состоянии воинской дисциплины, деятельности управлений и выявленных нарушениях;\n\nз) Обеспечение исполнения приказов и распоряжений начальника Генерального штаба и его заместителей.\n\n13.4. Начальник Управления военной полиции и дисциплины осуществляет руководство Военной полицией и Отделом «Росгвардия». Организует мероприятия по поддержанию правопорядка, предупреждению нарушений воинской дисциплины и контролю соблюдения военнослужащими установленных правил несения службы.\n\nВ пределах своих полномочий организует служебные проверки, контролирует деятельность Военной полиции и Росгвардии, обеспечивает охрану общественного порядка на территории военной части, а также координирует деятельность Росгвардии по патрулированию городских улиц в пределах пункта 10.12 УВС. Представляет предложения о привлечении военнослужащих к дисциплинарной ответственности.\n\n13.5. Начальник Управления военного образования и подготовки осуществляет руководство Военной академией и Учебно-тренировочным центром (УТЦ), отвечает за организацию обучения, профессиональную подготовку и повышение квалификации военнослужащих.\n\nОбеспечивает разработку и проведение учебных мероприятий, тренировок, проверок знаний уставов и практических навыков, контролирует качество подготовки личного состава и деятельность руководителей подведомственных подразделений.\n\n13.6. Начальник Управления специальных операций и разведки осуществляет руководство Главным разведывательным управлением (ГРУ), Силами специальных операций (ССО) и Ротой охраны и сопровождения (РОС), в том числе через назначенного Куратора РОС.\n\nОтвечает за организацию разведывательной деятельности, планирование и координацию специальных операций, подготовку личного состава подведомственных подразделений к выполнению поставленных задач, а также обеспечение взаимодействия между ГРУ, ООСпН, ССО и РОС, включая согласование охраны высшего командования и сопровождения военных поставок.\n\nДеятельность управления осуществляется в соответствии с действующими уставами, установленными правилами и приказами вышестоящего командования.\n\n13.6.1. Куратор РОС входит в состав Управления специальных операций и разведки и осуществляет надзор за РОС. Должность Куратора РОС учреждается в организационно-штатной структуре указанного управления.\n13.6.2. Куратор РОС непосредственно подчиняется Начальнику Управления специальных операций и разведки и является вышестоящим должностным лицом по отношению к Командиру РОС и его заместителю.\n13.6.3. Куратор РОС отвечает за надзор, координацию и организационный контроль деятельности роты, обеспечивает взаимодействие с руководством управления и иными подразделениями, рассматривает отчёты и доклады Командира РОС.\n13.6.4. Куратор РОС не заменяет Командира РОС в повседневном управлении личным составом. Оперативные поручения, за исключением случаев, предусмотренных пунктом 10.11.17 УВС, передаются через Командира РОС.\n13.6.5. Должность Куратора РОС замещается по отдельному приказу НГШ. До назначения должностного лица полномочия куратора исполняет Начальник Управления специальных операций и разведки.\n\n13.7. Начальник Управления координации и взаимодействия обеспечивает организацию межведомственного и внутриведомственного взаимодействия Вооружённых Сил России Онлайн.\n\nК его основным обязанностям относятся:\n\nа) Организация взаимодействия Вооружённых Сил с иными государственными структурами и ведомствами;\n\nб) Обеспечение служебного взаимодействия между управлениями и подразделениями Вооружённых Сил;\n\nв) Подготовка и проведение совместных мероприятий, совещаний и координационных встреч;\n\nг) Согласование совместных мероприятий и действий с представителями других государственных организаций в пределах предоставленных полномочий;\n\nд) Урегулирование организационных вопросов, возникающих при взаимодействии подразделений и ведомств;\n\nе) Подготовка предложений по совершенствованию системы межведомственного и внутриведомственного взаимодействия.\n\n13.8. Комендант военной части непосредственно подчиняется начальнику Генерального штаба и его заместителям.\n\nНачальники управлений подчиняются начальнику Генерального штаба и его заместителям, а по вопросам организации службы, внутреннего контроля и координации деятельности - коменданту военной части.\n\n13.9. Назначение на должность, освобождение от должности и перевод коменданта военной части, начальников управлений и Куратора РОС осуществляются приказом начальника Генерального штаба.\n\n13.10. Поощрение и привлечение коменданта военной части и начальников управлений к дисциплинарной ответственности осуществляются в установленном порядке начальником Генерального штаба.\n\n13.11. Начальники управлений несут персональную ответственность за деятельность подведомственных подразделений, исполнение поставленных задач, соблюдение воинской дисциплины и надлежащую организацию службы.\n\n13.12. Комендант военной части и начальники управлений обязаны знать и соблюдать действующие уставы, приказы и распоряжения вышестоящего командования, а также обеспечивать их исполнение подчинённым личным составом.\n\n13.13. В случае временного отсутствия коменданта военной части исполнение его обязанностей возлагается на одного из начальников управлений либо иное должностное лицо, назначенное приказом начальника Генерального штаба. Временное исполнение обязанностей коменданта не влечёт учреждения должности его заместителя.\n\nВ случае временного отсутствия начальника управления исполнение его обязанностей возлагается на уполномоченное должностное лицо в порядке, установленном начальником Генерального штаба.\n\n13.14. Комендант военной части вправе запрашивать у начальников управлений сведения о деятельности подведомственных подразделений, требовать устранения выявленных недостатков и представлять начальнику Генерального штаба предложения по совершенствовани
